<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粗野主义生成器 · BRUTALIST GEN</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/base.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo"></div>
    <h1>粗野主义生成器</h1>
    <span class="sub">/ brutalist generator v3</span>
  </div>
  <div class="actions">
    <span class="save-pill" id="savePill"><span class="save-pill__dot"></span><span id="savePillText">已保存</span></span>
    <div class="act-group">
      <button class="btn-sm ghost" id="undoBtn" type="button" title="撤销（Ctrl+Z）" disabled>撤销</button>
      <button class="btn-sm ghost" id="redoBtn" type="button" title="重做（Ctrl+Shift+Z）" disabled>重做</button>
    </div>
    <div class="act-group">
      <button class="btn-sm" id="randomBtn" type="button">随机组合</button>
      <button class="btn-sm ghost" id="resetBtn" type="button">重置</button>
    </div>
    <div class="act-group">
      <button class="btn-sm" id="shareBtn" type="button" title="把当前设置编码进链接并复制">分享链接</button>
      <button class="btn-sm" id="exportHtmlBtn" type="button" title="导出一份可直接双击运行的单文件 HTML">导出 HTML</button>
      <button class="btn-sm ghost" id="exportJsonBtn" type="button">导出配置</button>
      <button class="btn-sm ghost" id="importJsonBtn" type="button">导入配置</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </div>
</header>

<nav class="modebar" id="modebar" role="tablist" aria-label="组件模式"></nav>

<div class="app">

  <!-- ============ 控制面板 ============ -->
  <aside class="panel" id="panel" data-page-node-id="MO0y0lUKHknDLg2hlhoA2q">

    <section class="group">
      <h2>内容</h2>
      <div class="field">
        <label for="fText" id="textLabel">按钮文字</label>
        <input type="text" id="fText" data-key="text" maxlength="40" placeholder="BRUTAL">
      </div>
      <div class="field" data-modes="card">
        <label for="fSub">描述文字</label>
        <input type="text" id="fSub" data-key="sub" maxlength="80" placeholder="描述文字">
      </div>
      <div class="field" data-modes="button">
        <label for="fBadge">角标（留空隐藏）</label>
        <input type="text" id="fBadge" data-key="badge" maxlength="6" placeholder="NEW">
      </div>
    </section>
    <section class="group">
      <h2>预设方案</h2>
      <div class="presets">
        <button class="chip" type="button" data-preset="neon">荧光绿</button>
        <button class="chip" type="button" data-preset="classic">经典</button>
        <button class="chip" type="button" data-preset="invert">反色</button>
        <button class="chip" type="button" data-preset="hot">火红</button>
        <button class="chip" type="button" data-preset="paper">纸感</button>
        <button class="chip" type="button" data-preset="lemon">柠檬黄</button>
        <button class="chip" type="button" data-preset="cyan">电光青</button>
        <button class="chip" type="button" data-preset="bubble">泡泡糖</button>
        <button class="chip" type="button" data-preset="indigo">电光蓝</button>
        <button class="chip" type="button" data-preset="grape">葡萄紫</button>
        <button class="chip" type="button" data-preset="forest">墨绿</button>
        <button class="chip" type="button" data-preset="rust">铁锈红</button>
        <button class="chip" type="button" data-preset="blood">血红</button>
        <button class="chip" type="button" data-preset="mint">薄荷</button>
        <button class="chip" type="button" data-preset="concrete">水泥灰</button>
        <button class="chip" type="button" data-preset="blueprint">蓝图</button>
        <button class="chip" type="button" data-preset="coke">焦糖棕</button>
      </div>
    </section>
    <section class="group">
      <h2>配色</h2>
      <div class="grid-2">
        <div class="field">
          <label>背景色</label>
          <input type="color" data-key="bg">
        </div>
        <div class="field">
          <label>文字色</label>
          <input type="color" data-key="color">
        </div>
        <div class="field">
          <label>边框色</label>
          <input type="color" data-key="borderColor">
        </div>
        <div class="field">
          <label>阴影色</label>
          <input type="color" data-key="shadowColor">
        </div>
      </div>
    </section>
    <section class="group">
      <h2>形状</h2>
      <div class="field">
        <label>边框粗细 <span class="val"><span data-out="borderWidth"></span>px</span></label>
        <input type="range" data-key="borderWidth" min="0" max="16" step="1">
      </div>
      <div class="field">
        <label>圆角 <span class="val"><span data-out="radius"></span>px</span></label>
        <input type="range" data-key="radius" min="0" max="50" step="1">
      </div>
      <div class="field">
        <label>旋转角度 <span class="val"><span data-out="rotate"></span>°</span></label>
        <input type="range" data-key="rotate" min="-15" max="15" step="1">
      </div>
      <div class="grid-2">
        <div class="field">
          <label>阴影 X <span class="val"><span data-out="shadowX"></span></span></label>
          <input type="range" data-key="shadowX" min="0" max="30" step="1">
        </div>
        <div class="field">
          <label>阴影 Y <span class="val"><span data-out="shadowY"></span></span></label>
          <input type="range" data-key="shadowY" min="0" max="30" step="1">
        </div>
      </div>
      <div class="field">
        <label>阴影模糊 <span class="val"><span data-out="shadowBlur"></span>px</span></label>
        <input type="range" data-key="shadowBlur" min="0" max="40" step="1">
      </div>
      <div class="grid-2" data-modes="button card checkbox switch input">
        <div class="field">
          <label>横向内边距 <span class="val"><span data-out="padX"></span></span></label>
          <input type="range" data-key="padX" min="8" max="70" step="1">
        </div>
        <div class="field">
          <label>纵向内边距 <span class="val"><span data-out="padY"></span></span></label>
          <input type="range" data-key="padY" min="4" max="40" step="1">
        </div>
      </div>
    </section>
    <section class="group">
      <h2>排版</h2>
      <div class="field">
        <label for="fFont">字体族</label>
        <select id="fFont" data-key="fontFamily">
          <option value="mono">等宽 Mono</option>
          <option value="sans">无衬线 Sans</option>
          <option value="serif">衬线 Serif</option>
          <option value="impact">粗黑 Impact</option>
          <option value="arialblack">Arial Black</option>
        </select>
      </div>
      <div class="field">
        <label for="fWeight">字重</label>
        <select id="fWeight" data-key="fontWeight">
          <option value="400">400 · Regular</option>
          <option value="600">600 · Semibold</option>
          <option value="700">700 · Bold</option>
          <option value="800">800 · Extrabold</option>
          <option value="900">900 · Black</option>
        </select>
      </div>
      <div class="field">
        <label>字号 <span class="val"><span data-out="fontSize"></span>px</span></label>
        <input type="range" data-key="fontSize" min="10" max="42" step="1">
      </div>
      <div class="field">
        <label>字间距 <span class="val"><span data-out="letterSpacing"></span>px</span></label>
        <input type="range" data-key="letterSpacing" min="-1" max="8" step="0.5">
      </div>
      <div class="checks">
        <label class="check"><input type="checkbox" data-key="uppercase"> 全大写</label>
      </div>
    </section>
    <section class="group">
      <h2>表面图案</h2>
      <div class="field">
        <label for="fPattern">背景纹理</label>
        <select id="fPattern" data-key="pattern">
          <option value="none">纯色</option>
          <option value="stripes">斜条纹</option>
          <option value="grid">网格</option>
          <option value="dots">圆点</option>
        </select>
      </div>
    </section>
    <section class="group">
      <h2>状态预览</h2>
      <div class="checks">
        <label class="check"><input type="checkbox" data-key="showMatrix"> 五态矩阵（默认 / 悬停 / 按下 / 聚焦 / 禁用）</label>
      </div>
    </section>
    <section class="group">
      <h2>交互</h2>
      <div class="checks">
        <label class="check"><input type="checkbox" data-key="hoverStraighten"> 悬停摆正</label>
        <label class="check"><input type="checkbox" data-key="hoverLift"> 悬停上浮</label>
        <label class="check"><input type="checkbox" data-key="hoverGrowShadow"> 阴影膨胀</label>
        <label class="check"><input type="checkbox" data-key="hoverInvert"> 悬停反色</label>
        <label class="check"><input type="checkbox" data-key="pressShake"> 按下抖动</label>
      </div>
    </section>
    <section class="group">
      <h2>工作台</h2>
      <div class="field">
        <label>预览底色</label>
        <div class="presets">
          <button class="chip" type="button" data-pvbg="grid">网格</button>
          <button class="chip" type="button" data-pvbg="light">纯白</button>
          <button class="chip" type="button" data-pvbg="dark">深底</button>
          <button class="chip" type="button" data-pvbg="checker">棋盘</button>
        </div>
      </div>
      <div class="field">
        <label>设备宽度</label>
        <div class="presets">
          <button class="chip" type="button" data-dev="0">自适应</button>
          <button class="chip" type="button" data-dev="390">手机 390</button>
          <button class="chip" type="button" data-dev="768">平板 768</button>
          <button class="chip" type="button" data-dev="1024">桌面 1024</button>
        </div>
      </div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="vCodeHL"> 代码语法高亮</label>
        <label class="check"><input type="checkbox" id="vMinify"> 压缩输出代码</label>
      </div>
      <div class="field">
        <label>画布空间</label>
        <button class="chip" id="fullpageBtn" type="button"
          title="全屏看单独生成的页面，不看工作台其它元素（Esc 关闭）">全屏预览页面</button>
      </div>
      <p class="hint">底色与宽度只影响预览画布，不会写进导出的代码；「压缩输出」同时作用于复制与导出的内容。</p>
    </section>

    <!-- 各模式专属控制分组由 app.js 按注册表动态注入 -->
    <div id="modePanels"></div>

  </aside>

  <!-- ============ 舞台 ============ -->
  <main class="stage">

    <div class="preview" id="preview"></div>

    <div class="code-area">
      <div class="code-block">
        <div class="code-head">
          <span>HTML</span>
          <button class="copy" type="button" data-target="htmlCode">复制</button>
        </div>
        <pre><code id="htmlCode"></code></pre>
      </div>
      <div class="code-block">
        <div class="code-head">
          <span>CSS</span>
          <button class="copy" type="button" data-target="cssCode">复制</button>
        </div>
        <pre><code id="cssCode"></code></pre>
      </div>
    </div>

  </main>

</div>

<style id="genStyle"></style>

<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/interact.js"></script>
<script src="js/components/button.js"></script>
<script src="js/components/card.js"></script>
<script src="js/components/checkbox.js"></script>
<script src="js/components/switch.js"></script>
<script src="js/components/input.js"></script>
<script src="js/components/badge.js"></script>
<script src="js/components/radio.js"></script>
<script src="js/components/progress.js"></script>
<script src="js/components/slider.js"></script>
<script src="js/components/select.js"></script>
<script src="js/components/alert.js"></script>
<script src="js/components/table.js"></script>
<script src="js/components/nav.js"></script>
<script src="js/components/tabs.js"></script>
<script src="js/components/page.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
