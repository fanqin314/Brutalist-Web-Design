  /* ---------- SWITCH ----------
     骨架：轨道 4em × 2em，滑块尺寸随边框自适应，位移恒为 1.64em
     变量：swStyle 风格变体 · knobIcon 滑块图标 · motion 过渡曲线
           swScale 整体缩放 · glow 外发光 · offColor 关闭态底色 */
  function cssSwitch(s) {
    let L = [];
    const pattern = getPattern(s);
    const style = SW_STYLES[s.swStyle] ? s.swStyle : 'brutal';
    const mo = MOTION[s.motion] || MOTION.spring;
    const ease = mo.ease + ' ' + mo.dur + 's';
    const bw = s.borderWidth;
    const off = s.offColor || '#ffffff';
    const g = s.glow || 0;
    const pad = 0.18;

    const thumbSize  = 'calc(2em - 2 * ' + bw + 'px - ' + (pad * 2) + 'em)';
    const thumbInset = 'calc(' + bw + 'px + ' + pad + 'em)';
    const travel     = (2 - pad * 2) + 'em';

    /* ---- 变体骨架：K = 关闭态，O = 开启态 ---- */
    const K = {};
    const O = {};

    if (style === 'slab') {
      /* 厚板镂空：墨色实心厚板 + 镂空的方孔滑块，开启时变实心块 */
      K.radius = s.radius + 'px'; K.thumbRadius = s.radius + 'px'; K.border = bw;
      K.trackColor = s.borderColor;
      K.trackShadow = hasShadow(s) ? shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor) : null;
      K.thumbColor = 'transparent';
      K.thumbShadow = 'inset 0 0 0 ' + Math.max(3, Math.round(bw * 0.8)) + 'px ' + off;
      O.trackColor = s.bg;
      O.trackShadow = K.trackShadow;
      O.thumbColor = s.borderColor;
      O.thumbShadow = null;
      K.icon = contrastOn(s.borderColor, s.borderColor, off);
      O.icon = contrastOn(s.borderColor, s.color, s.bg);

    } else if (style === 'double') {
      /* 双框硬描：边框外再套一圈描边，中间留出一道空隙，像套色错版 */
      const dGap = 3, dLine = 3;
      const dFrame = '0 0 0 ' + dGap + 'px ' + off + ', 0 0 0 ' + (dGap + dLine) + 'px ' + s.borderColor;
      K.radius = s.radius + 'px'; K.thumbRadius = s.radius + 'px'; K.border = bw;
      K.trackColor = off;
      K.trackShadow = dFrame;
      K.thumbColor = s.color;
      K.thumbShadow = null;
      O.trackColor = s.bg;
      O.trackShadow = dFrame;
      O.thumbColor = s.color;
      O.thumbShadow = null;
      K.icon = O.icon = contrastOn(s.color, s.color, s.bg);

    } else if (style === 'split') {
      /* 对半硬切：一块墨色硬块把轨道一分为二，开关时整块翻到另一侧 */
      K.radius = s.radius + 'px'; K.thumbRadius = s.radius + 'px'; K.border = bw;
      K.trackColor = off;
      K.trackImage = 'linear-gradient(90deg, ' + s.borderColor + ' 0 50%, transparent 50% 100%)';
      K.trackShadow = hasShadow(s) ? shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor) : null;
      K.thumbColor = off;
      K.thumbShadow = null;
      O.trackColor = s.bg;
      O.trackImage = 'linear-gradient(90deg, transparent 0 50%, ' + s.borderColor + ' 50% 100%)';
      O.trackShadow = K.trackShadow;
      O.thumbColor = off;
      O.thumbShadow = null;
      K.icon = O.icon = contrastOn(off, s.color, s.bg);

    } else if (style === 'tape') {
      /* 条带封条：轨道上下各压一条墨色硬带，滑块嵌在两条带之间 */
      const band = Math.max(3, Math.round(bw * 1.2));
      K.radius = s.radius + 'px'; K.thumbRadius = s.radius + 'px'; K.border = bw;
      K.trackColor = off;
      K.trackImage = 'linear-gradient(180deg, ' + s.borderColor + ' 0 ' + band + 'px, transparent ' + band +
                      'px calc(100% - ' + band + 'px), ' + s.borderColor + ' calc(100% - ' + band + 'px) 100%)';
      K.trackShadow = hasShadow(s) ? shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor) : null;
      K.thumbColor = s.color;
      K.thumbShadow = null;
      O.trackColor = s.bg;
      O.trackImage = K.trackImage;
      O.trackShadow = K.trackShadow;
      O.thumbColor = s.color;
      O.thumbShadow = null;
      K.icon = O.icon = contrastOn(s.color, s.color, s.bg);

    } else if (style === 'flip') {
      /* 反相硬块：关是墨底浅块，开整体反相成彩底墨块，无过渡装饰 */
      K.radius = s.radius + 'px'; K.thumbRadius = s.radius + 'px'; K.border = bw;
      K.trackColor = s.borderColor;
      K.trackShadow = hasShadow(s) ? shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor) : null;
      K.thumbColor = off;
      K.thumbShadow = null;
      O.trackColor = s.bg;
      O.trackShadow = K.trackShadow;
      O.thumbColor = s.borderColor;
      O.thumbShadow = null;
      K.icon = contrastOn(off, s.color, s.bg);
      O.icon = contrastOn(s.borderColor, s.color, off);

    } else if (style === 'offset') {
      /* 错位叠影：轨道挂一块错开的实心硬影，滑块关/开反相 */
      K.radius = s.radius + 'px'; K.thumbRadius = s.radius + 'px'; K.border = bw;
      K.trackColor = off;
      K.trackShadow = '6px 6px 0 ' + s.borderColor;
      K.thumbColor = s.color;
      K.thumbShadow = null;
      O.trackColor = s.bg;
      O.trackShadow = K.trackShadow;
      O.thumbColor = '#ffffff';
      O.thumbShadow = null;
      K.icon = contrastOn(s.color, s.color, '#ffffff');
      O.icon = contrastOn('#ffffff', s.color, s.bg);

    } else if (style === 'stripe') {
      /* 警戒条纹：条纹方向随开关状态翻转 */
      K.radius = s.radius + 'px'; K.thumbRadius = s.radius + 'px'; K.border = bw;
      K.trackColor = off;
      K.trackImage = 'repeating-linear-gradient(45deg, transparent 0 6px, ' +
                     hexToRgba(s.color, 0.3) + ' 6px 12px)';
      K.trackShadow = hasShadow(s) ? shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor) : null;
      K.thumbColor = s.color;
      K.thumbShadow = 'inset 0 0 0 2px ' + s.bg;
      O.trackColor = s.bg;
      O.trackImage = 'repeating-linear-gradient(-45deg, transparent 0 6px, ' +
                     hexToRgba(s.color, 0.45) + ' 6px 12px)';
      O.trackShadow = K.trackShadow;
      O.thumbColor = s.color;
      O.thumbShadow = K.thumbShadow;
      K.icon = O.icon = contrastOn(s.color, s.color, s.bg);

    } else if (style === 'skew') {
      /* 斜切块：轨道整体斜切，滑块反向补偿保持正立 */
      K.radius = s.radius + 'px'; K.thumbRadius = s.radius + 'px'; K.border = bw;
      K.trackColor = off;
      K.trackShadow = hasShadow(s) ? shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor) : null;
      K.thumbColor = s.color;
      K.thumbShadow = null;
      O.trackColor = s.bg;
      O.trackShadow = K.trackShadow;
      O.thumbColor = s.color;
      O.thumbShadow = null;
      K.icon = O.icon = contrastOn(s.color, s.color, s.bg);

    } else {
      /* brutal：粗野硬边 + 硬阴影 */
      K.radius = s.radius + 'px'; K.thumbRadius = s.radius + 'px'; K.border = bw;
      K.trackColor = off;
      K.trackShadow = hasShadow(s) ? shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor) : null;
      K.thumbColor = s.color;
      K.thumbShadow = null;
      O.trackColor = s.bg;
      O.trackShadow = K.trackShadow;
      O.thumbColor = s.color;
      O.thumbShadow = null;
      K.icon = O.icon = contrastOn(s.color, s.color, s.bg);
    }

    /* ---- 外扩硬边：无模糊的实心扩散环，替代柔和的霓虹光晕 ---- */
    if (g > 0) {
      O.trackShadow = (O.trackShadow ? O.trackShadow + ', ' : '') + '0 0 0 ' + g + 'px ' + s.bg;
    }

    /* 纹理与变体底图叠成多层背景 */
    function compose(img, size) {
      if (!pattern) return { img: img || null, size: size || null };
      if (!img) return { img: pattern.image, size: pattern.size };
      return { img: pattern.image + ', ' + img, size: pattern.size + ', ' + (size || 'auto') };
    }
    function bgLines(obj) {
      const out = [];
      if (obj.img) {
        out.push('  background-image: ' + obj.img + ';');
        out.push('  background-size: ' + obj.size + ';');
      }
      return out;
    }

    const kBg = compose(K.trackImage, null);
    const oBg = compose(O.trackImage, null);

    /* ---------- 输出 ---------- */
    L.push('.brutal-switch {');
    L.push('  display: inline-flex;');
    L.push('  align-items: center;');
    L.push('  gap: 12px;');
    L.push('  cursor: pointer;');
    L.push('  user-select: none;');
    L.push('  color: ' + s.color + ';');
    L = L.concat(fontLines(s));
    L.push('  line-height: 1;');
    L.push('}');

    L.push('');
    L.push('.brutal-switch input {');
    L.push('  position: absolute;');
    L.push('  opacity: 0;');
    L.push('  pointer-events: none;');
    L.push('}');

    L.push('');
    L.push('.brutal-switch__track {');
    L.push('  position: relative;');
    L.push('  flex: 0 0 auto;');
    L.push('  width: 4em;');
    L.push('  height: 2em;');
    L.push('  font-size: ' + (16 * (s.swScale || 1)) + 'px;');   /* 整体缩放全靠这一行 */
    L.push('  background-color: ' + K.trackColor + ';');
    L = L.concat(bgLines(kBg));
    L.push('  border: ' + K.border + 'px solid ' + s.borderColor + ';');
    L.push('  border-radius: ' + K.radius + ';');
    if (style === 'skew') L.push('  transform: skewX(-12deg);');
    if (K.trackShadow) L.push('  box-shadow: ' + K.trackShadow + ';');
    L.push('  transition: background-color .2s ease, box-shadow .2s ease, border-color .2s ease;');
    L.push('}');

    L.push('');
    L.push('.brutal-switch__thumb {');
    L.push('  position: absolute;');
    L.push('  top: 50%;');
    L.push('  left: ' + thumbInset + ';');
    L.push('  width: ' + thumbSize + ';');
    L.push('  height: ' + thumbSize + ';');
    if (K.thumbColor) L.push('  background-color: ' + K.thumbColor + ';');
    if (K.thumbImage) L.push('  background-image: ' + K.thumbImage + ';');
    L.push('  border-radius: ' + K.thumbRadius + ';');
    if (K.thumbShadow) L.push('  box-shadow: ' + K.thumbShadow + ';');
    L.push('  --thumb-bg: ' + (K.thumbColor || '#dcdcdc') + ';');
    L.push('  transform: translateY(-50%)' + (style === 'skew' ? ' skewX(12deg)' : '') + ';');
    L.push('  transition: transform ' + ease + ', background-color .2s ease, box-shadow .2s ease;');
    L.push('}');

    L.push('');
    L.push('.brutal-switch__icon {');
    L.push('  position: absolute;');
    L.push('  inset: 0;');
    if (s.knobIcon && s.knobIcon !== 'none') L.push('  color: ' + K.icon + ';');
    L.push('}');
    const iL = iconLines(s.knobIcon);
    if (iL.length) {
      L.push('');
      L = L.concat(iL);
    }

    L.push('');
    L.push('.brutal-switch input:checked + .brutal-switch__track {');
    L.push('  background-color: ' + O.trackColor + ';');
    L = L.concat(bgLines(oBg));
    if (O.trackShadow) L.push('  box-shadow: ' + O.trackShadow + ';');
    L.push('}');

    L.push('');
    L.push('.brutal-switch input:checked + .brutal-switch__track .brutal-switch__thumb {');
    L.push('  transform: translateY(-50%) translateX(' + travel + ')' +
           (style === 'skew' ? ' skewX(12deg)' : '') + ';');
    if (O.thumbColor) L.push('  background-color: ' + O.thumbColor + ';');
    if (O.thumbImage) L.push('  background-image: ' + O.thumbImage + ';');
    if (O.thumbShadow) L.push('  box-shadow: ' + O.thumbShadow + ';');
    L.push('  --thumb-bg: ' + (O.thumbColor || '#dcdcdc') + ';');
    L.push('}');

    /* 关闭 / 开启两态图标色不同的变体（如厚板镂空、反相硬块）需要单独覆盖 */
    if (s.knobIcon && s.knobIcon !== 'none' && O.icon !== K.icon) {
      L.push('');
      L.push('.brutal-switch input:checked + .brutal-switch__track .brutal-switch__icon {');
      L.push('  color: ' + O.icon + ';');
      L.push('}');
    }

    return L;
  }

  /* ---------- INPUT ----------
     <input> 是替换元素，伪元素挂不上去 —— 所以输入框一律套一层壳（.brutal-field），
     裸 input 只负责收字。这样「前置标记 / 后缀单位 / 标签牌」才能对所有变体成立，
     壳也才能像卡片一样长出伪元素装饰（顶条 / 角夹 / 取形层 / 斜纹带）。
     变体：inStyle（brutal / double / under / label / term /
                    bracket / bevel / band / rail / stamp / stripe） */
  function inMarkDecls(mark) {
    switch (mark) {
      case 'caret':  return { kind: 'glyph', content: '>' };
      case 'prompt': return { kind: 'glyph', content: '$' };
      case 'at':     return { kind: 'glyph', content: '@' };
      case 'hash':   return { kind: 'glyph', content: '#' };
      case 'star':   return { kind: 'glyph', content: '*' };
      case 'arrow':  return { kind: 'glyph', content: '\u2192' };
      case 'block':  return { kind: 'box', w: '.5em',  h: '.5em',  radius: '0' };
      case 'dot':    return { kind: 'box', w: '.46em', h: '.46em', radius: '50%' };
      default:       return null;
    }
  }

  function cssInput(s) {
    let L = [];
    const style   = IN_STYLES[s.inStyle] ? s.inStyle : 'brutal';
    const pattern = getPattern(s);
    const hs      = hasShadow(s);
    const bw      = Math.max(0, s.borderWidth);
    const W       = (s.inW === undefined) ? 320 : s.inW;
    const fs      = s.fontSize;
    const r       = s.radius;
    const mk      = IN_MARKS[s.inMark] ? inMarkDecls(s.inMark) : null;
    const unit    = (s.inUnit || '').trim();
    const focus   = IN_FOCUS[s.inFocus] ? s.inFocus : 'press';
    const plate   = (style === 'label');       /* 左侧标签牌 */

    const base  = hs ? shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor) : null;
    const press = shadowStr(Math.max(0, s.shadowX - 2), Math.max(0, s.shadowY - 2),
                            s.shadowBlur, s.shadowColor);
    const hOver = hoverShadow(s);
    const needHover = s.hoverStraighten || s.hoverLift || s.hoverGrowShadow || s.hoverInvert;

    /* —— 版式参数：全部随字号 / 边框粗细缩放，字号滑杆即整体放大缩小 —— */
    const ub     = bw > 0 ? Math.max(5, Math.round(bw * 1.5)) : 6;   /* 底线粗细 */
    const barH   = Math.max(15, Math.round(fs * 1.05));              /* 顶栏条高 */
    const railW  = Math.min(38, Math.max(12, Math.round(bw * 3.2))); /* 侧栏条宽 */
    const cut    = Math.max(9,  Math.round(fs * 0.62));              /* 斜切边长 */
    const ringG  = Math.max(5,  Math.round(bw * 1.2));               /* 印章内框留白 */
    const ringW  = Math.max(2,  Math.round(bw * 0.55));              /* 印章内框线宽 */
    const stripH = Math.max(8,  Math.round(fs * 0.6));               /* 斜纹带高 */
    const stripS = Math.max(4,  Math.round(stripH * 0.9));           /* 斜纹步长 */
    const brL    = Math.max(18, Math.round(fs * 1.5));               /* 角夹边长 */
    const brT    = Math.max(2, bw);                                  /* 角夹线粗 */
    const brOut  = brT + 3;                                          /* 角夹外扩量 */
    const thin   = Math.max(2, bw);

    let padT = s.padY, padR = s.padX, padB = s.padY, padL = s.padX;
    let clip = null;          /* 交给 ::before 的取形层 */
    let layerShadow = false;  /* 硬影改走 ::after 影子层（drop-shadow 会把文字也投出影） */
    let flat = false;         /* 完全不出影 */
    let useBorder = true;
    const deco  = [];         /* inset 装饰影，与悬停影并存（不能直接被覆盖） */
    const extra = [];         /* 追加到壳上的声明 */

    if (style === 'label') {
      padT = padR = padB = padL = 0;          /* 让标签牌自己顶到壳边 */

    } else if (style === 'band') {
      padT = s.padY + barH;                   /* 给顶条让位 */

    } else if (style === 'rail') {
      padL = s.padX + railW;
      useBorder = bw > 0;
      extra.push('  border-left: ' + railW + 'px solid ' + s.borderColor + ';');

    } else if (style === 'bracket') {
      useBorder = false; flat = true;         /* 靠四只角夹立住，不要边框与投影 */

    } else if (style === 'bevel') {
      useBorder = false; layerShadow = true;
      clip = 'polygon(' + cut + 'px 0, 100% 0, 100% calc(100% - ' + cut + 'px), ' +
             'calc(100% - ' + cut + 'px) 100%, 0 100%, 0 ' + cut + 'px)';

    } else if (style === 'stamp') {
      deco.push('inset 0 0 0 ' + ringG + 'px ' + s.bg);
      deco.push('inset 0 0 0 ' + (ringG + ringW) + 'px ' + s.borderColor);
      extra.push('  outline: ' + Math.max(1, Math.round(bw * 0.5)) + 'px dashed ' + s.borderColor + ';');
      extra.push('  outline-offset: 5px;');
      padT = Math.max(padT, ringG + ringW + 3);
      padB = Math.max(padB, ringG + ringW + 3);
      padL = Math.max(padL, ringG + ringW + 3);
      padR = Math.max(padR, ringG + ringW + 3);

    } else if (style === 'stripe') {
      useBorder = false;
      padB = s.padY + stripH;
      extra.push('  border-top: ' + thin + 'px solid ' + s.borderColor + ';');
      extra.push('  border-left: ' + thin + 'px solid ' + s.borderColor + ';');
      extra.push('  border-right: ' + thin + 'px solid ' + s.borderColor + ';');

    } else if (style === 'under') {
      useBorder = false;
      extra.push('  border-bottom: ' + ub + 'px solid ' + s.borderColor + ';');

    } else if (style === 'term') {
      useBorder = false;
      extra.push('  border: ' + Math.max(2, bw) + 'px solid ' + s.bg + ';');
    }
    /* brutal / double：基础边框即可，区别在聚焦与投影 */

    const shAll = (flat || layerShadow || !base) ? deco.slice() : [base].concat(deco);
    const padStr = (padT === padB && padR === padL)
      ? (padT === padR ? padT + 'px' : padT + 'px ' + padR + 'px')
      : (padT + 'px ' + padR + 'px ' + padB + 'px ' + padL + 'px');

    /* ---- 壳 ---- */
    L.push('.brutal-field {');
    L.push('  position: relative;');
    L.push('  box-sizing: border-box;');              /* inW 即外宽（含内边距与边框） */
    if (clip) L.push('  isolation: isolate;');        /* 取形层要能安全垫底 */
    L.push('  display: inline-flex;');
    L.push('  align-items: center;');
    L.push('  flex: 0 0 auto;');                       /* 预览区是 flex 容器，别被压扁 */
    L.push('  width: ' + W + 'px;');
    L.push('  max-width: 100%;');
    L.push('  padding: ' + padStr + ';');
    if (clip) L.push('  background: transparent;');    /* 填充交给取形层 */
    else if (style === 'term') {
      L.push('  background-color: #141414;');
      if (pattern) {
        L.push('  background-image: ' + pattern.image + ';');
        L.push('  background-size: ' + pattern.size + ';');
      }
    } else L = L.concat(bgLines(s, pattern));
    L.push('  color: ' + (style === 'term' ? s.bg : s.color) + ';');
    if (useBorder) L = L.concat(borderLines(s));
    else L.push('  border: none;');
    L.push('  border-radius: ' + r + 'px;');
    if (shAll.length) L.push('  box-shadow: ' + shAll.join(', ') + ';');
    L = L.concat(fontLines(s));
    L.push('  line-height: 1.2;');
    L.push('  cursor: text;');
    L.push('  transition: translate .12s ease, box-shadow .14s ease,');
    L.push('              border-color .16s ease, background-color .16s ease, color .16s ease;');
    if (s.rotate !== 0) L.push('  transform: rotate(' + s.rotate + 'deg);');
    L = L.concat(extra);
    L.push('}');

    /* ---- 内部裸 input：所有皮肤都长在壳上，input 透明 ---- */
    L.push('');
    L.push('.brutal-field .brutal-input {');
    L.push('  flex: 1 1 auto;');
    L.push('  min-width: 0;');
    L.push('  width: auto;');
    L.push('  margin: 0;');
    L.push('  padding: ' + (plate ? (s.padY + 'px ' + s.padX + 'px') : '0') + ';');
    L.push('  border: none;');
    L.push('  border-radius: 0;');
    L.push('  background: transparent;');
    L.push('  box-shadow: none;');
    L.push('  outline: none;');
    L.push('  color: inherit;');       /* 反色 / 终端反白要跟着壳走 */
    L.push('  font: inherit;');        /* 表单控件不继承字体，必须显式 */
    L.push('  line-height: 1.2;');
    L.push('  -webkit-appearance: none;');
    L.push('  appearance: none;');
    L.push('}');
    L.push('.brutal-field .brutal-input::placeholder {');
    L.push('  color: currentColor;');
    L.push('  opacity: 0.42;');
    L.push('}');

    /* ---- 左侧标签牌（label 变体） ---- */
    if (plate) {
      L.push('');
      L.push('.brutal-field__tag {');
      L.push('  display: inline-flex;');
      L.push('  align-items: center;');
      L.push('  align-self: stretch;');   /* 顶满壳高，读起来是一块牌子不是一颗按钮 */
      L.push('  flex: 0 0 auto;');
      L.push('  padding: 0 ' + s.padX + 'px;');
      L.push('  background-color: ' + s.color + ';');
      L.push('  color: ' + s.bg + ';');
      if (bw > 0) L.push('  border-right: ' + bw + 'px solid ' + s.borderColor + ';');
      L = L.concat(fontLines(s, '  ', Math.round(fs * 0.8)));
      L.push('  line-height: 1;');
      L.push('  white-space: nowrap;');
      L.push('  transition: background-color .16s ease, color .16s ease;');
      L.push('}');
    }

    /* ---- 前置标记（纯 CSS，currentColor 着色，跟随反色翻转） ---- */
    if (mk) {
      L.push('');
      L.push('.brutal-field__mark {');
      L.push('  display: inline-flex;');
      L.push('  align-items: center;');
      L.push('  justify-content: center;');
      L.push('  flex: 0 0 auto;');
      L.push('  margin-right: 0.55em;');
      L.push('  line-height: 1;');
      L.push('  opacity: 0.9;');
      L.push('}');
      L.push('.brutal-field__mark::before {');
      if (mk.kind === 'glyph') {
        L.push('  content: "' + mk.content + '";');
      } else {
        L.push("  content: '';");
        L.push('  width: ' + mk.w + ';');
        L.push('  height: ' + mk.h + ';');
        L.push('  background: currentColor;');
        if (mk.radius !== '0') L.push('  border-radius: ' + mk.radius + ';');
      }
      L.push('}');
    }

    /* ---- 后缀单位 ---- */
    if (unit) {
      L.push('');
      L.push('.brutal-field__unit {');
      L.push('  display: inline-flex;');
      L.push('  align-items: center;');
      L.push('  flex: 0 0 auto;');
      L.push('  margin-left: 0.55em;');
      L.push('  font-size: 0.9em;');
      L.push('  line-height: 1;');
      L.push('  opacity: 0.62;');
      L.push('}');
    }

    /* ---- 变体装饰层 ---- */

    if (style === 'double') {
      /* 双线硬框：内框在壳上，外框是 detached 描边，聚焦时外框往里收 */
      L.push('');
      L.push('.brutal-field {');
      L.push('  outline: ' + Math.max(2, Math.round(bw * 0.75)) + 'px solid ' + s.borderColor + ';');
      L.push('  outline-offset: ' + Math.max(4, Math.round(bw * 1.5)) + 'px;');
      L.push('}');
      L.push('.brutal-field:focus-within {');
      L.push('  outline-width: ' + Math.max(3, bw) + 'px;');
      L.push('  outline-offset: 2px;');
      L.push('}');
    }

    if (style === 'band') {
      /* 顶栏硬切：实心墨条压在顶上，标记搬进条里反白 */
      L.push('');
      L.push('.brutal-field::before {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  top: 0; left: 0; right: 0;');
      L.push('  height: ' + barH + 'px;');
      L.push('  background: ' + s.borderColor + ';');
      L.push('  pointer-events: none;');
      L.push('}');
      if (mk) {
        L.push('.brutal-field__mark {');
        L.push('  position: absolute;');   /* 绝对定位后不占文字行，条上独享一格 */
        L.push('  top: 0; left: ' + s.padX + 'px;');
        L.push('  height: ' + barH + 'px;');
        L.push('  margin: 0;');
        L.push('  color: ' + s.bg + ';');
        L.push('  z-index: 1;');
        L.push('}');
      }
    }

    if (style === 'rail' && mk) {
      /* 侧栏标条：标记竖着住进标条，同样不占文字行 */
      L.push('');
      L.push('.brutal-field__mark {');
      L.push('  position: absolute;');
      L.push('  left: -' + railW + 'px;');
      L.push('  top: -' + bw + 'px; bottom: -' + bw + 'px;');
      L.push('  width: ' + railW + 'px;');
      L.push('  margin: 0;');
      L.push('  color: ' + s.bg + ';');
      L.push('  z-index: 1;');
      L.push('}');
    }

    if (style === 'bracket') {
      /* 四角夹框：8 层背景拼出四只 L 角，夹在壳外侧；聚焦时角夹加粗换色 */
      const bars = function (th, col) {
        const g = 'linear-gradient(' + col + ', ' + col + ')';
        const sizeH = brL + 'px ' + th + 'px';
        const sizeV = th + 'px ' + brL + 'px';
        return [g + ' 0 0 / ' + sizeH + ' no-repeat',
                g + ' 0 0 / ' + sizeV + ' no-repeat',
                g + ' 100% 0 / ' + sizeH + ' no-repeat',
                g + ' 100% 0 / ' + sizeV + ' no-repeat',
                g + ' 0 100% / ' + sizeH + ' no-repeat',
                g + ' 0 100% / ' + sizeV + ' no-repeat',
                g + ' 100% 100% / ' + sizeH + ' no-repeat',
                g + ' 100% 100% / ' + sizeV + ' no-repeat'];
      };
      L.push('');
      L.push('.brutal-field::before {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  top: -' + brOut + 'px; right: -' + brOut + 'px;');
      L.push('  bottom: -' + brOut + 'px; left: -' + brOut + 'px;');
      L.push('  z-index: 0;');
      L.push('  pointer-events: none;');
      L.push('  background:');
      L.push('    ' + bars(brT, s.borderColor).join(',\n    ') + ';');
      L.push('}');
      L.push('.brutal-field:focus-within::before {');
      L.push('  background:');
      L.push('    ' + bars(Math.round(brT * 1.6), s.color).join(',\n    ') + ';');
      L.push('}');
    }

    if (clip) {
      /* 取形层：只给 bevel 用，垫在文字之下承载填充与纹理 */
      L.push('');
      L.push('.brutal-field::before {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  inset: 0;');
      L.push('  z-index: -1;');           /* 垫到文字之下（靠父级 isolation 兜住） */
      L = L.concat(bgLines(s, pattern));
      L.push('  clip-path: ' + clip + ';');
      if (r > 0) L.push('  border-radius: ' + r + 'px;');
      L.push('}');
    }

    if (layerShadow && base) {
      /* 影子层：与取形层同形，单独平移出来垫在最底下。
         比父级 filter: drop-shadow 干净 —— 后者会把壳里的文字一起投出影 */
      L.push('');
      L.push('.brutal-field::after {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  inset: 0;');
      L.push('  z-index: -2;');
      L.push('  background: ' + s.shadowColor + ';');
      L.push('  clip-path: ' + clip + ';');
      if (r > 0) L.push('  border-radius: ' + r + 'px;');
      L.push('  transform: translate(' + s.shadowX + 'px, ' + s.shadowY + 'px);');
      L.push('  pointer-events: none;');
      L.push('}');
    }

    if (style === 'stripe') {
      /* 警戒条纹：底部一条斜纹带（只有此变体用 ::after，不打架） */
      L.push('');
      L.push('.brutal-field::after {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  left: 0; right: 0; bottom: 0;');
      L.push('  height: ' + stripH + 'px;');
      L.push('  border-top: ' + thin + 'px solid ' + s.borderColor + ';');
      L.push('  background-image: repeating-linear-gradient(45deg, ' +
             s.borderColor + ' 0 ' + stripS + 'px, ' + s.bg + ' ' + stripS + 'px ' +
             (stripS * 2) + 'px);');
      L.push('  pointer-events: none;');
      L.push('}');
    }

    if (style === 'term') {
      /* 终端反白：提示符闪烁 + 聚焦发硬光（solid，不是模糊光晕） */
      if (mk) {
        L.push('');
        L.push('.brutal-field__mark { animation: brutal-in-blink 1.1s steps(1, end) infinite; }');
      }
      L.push('');
      L.push('@keyframes brutal-in-blink {');
      L.push('  0%, 60% { opacity: 1; }');
      L.push('  61%, 100% { opacity: 0.15; }');
      L.push('}');
      L.push('.brutal-field:focus-within {');
      L.push('  box-shadow: ' + (base ? base + ', ' : '') +
              '0 0 14px ' + hexToRgba(s.bg, 0.72) + ';');
      L.push('}');
    }

    /* ---- 悬停：与卡片同一套开关，装饰影叠加而非覆盖 ---- */
    if (needHover) {
      const layerHover = [];
      L.push('');
      L.push('.brutal-field:hover {');
      if (s.hoverStraighten && s.rotate !== 0) L.push('  transform: rotate(0deg);');
      if (s.hoverLift) L.push('  translate: 0 -3px;');
      if (s.hoverInvert && style !== 'term') {
        L.push('  background-color: ' + s.color + ';');
        L.push('  color: ' + s.bg + ';');
        if (bw > 0 && !clip) L.push('  border-color: ' + s.bg + ';');
      }
      if (s.hoverGrowShadow && base) {
        if (layerShadow) {
          layerHover.push('  transform: translate(' + Math.round(s.shadowX * 1.6) + 'px, ' +
                          (Math.round(s.shadowY * 1.6) + (s.hoverLift ? 6 : 0)) + 'px);');
        } else if (!flat) {
          const hv = (hOver && hOver !== 'none') ? [hOver].concat(deco) : deco.slice();
          if (hv.length) L.push('  box-shadow: ' + hv.join(', ') + ';');
        }
      }
      L.push('}');
      if (layerHover.length) {
        L.push('.brutal-field:hover::after {');
        L = L.concat(layerHover);
        L.push('}');
      }
    }

    /* ---- 聚焦：变体签名态 + inFocus 附加态 ---- */
    const focusDecls = [];
    const focusLayer = [];      /* 打在 ::before 取形层上的反色 */
    const focusAfter = [];      /* 打在 ::after 影子层上的位移 */

    if (style === 'under') {
      focusDecls.push('  border-bottom-width: ' + (ub * 2) + 'px;');  /* 底边再砸厚一倍 */
    }
    if (focus === 'press' && style !== 'term') {
      focusDecls.push('  translate: 2px 2px;');
      if (layerShadow) {
        focusAfter.push('  transform: translate(' + Math.max(0, s.shadowX - 2) + 'px, ' +
                        Math.max(0, s.shadowY - 2) + 'px);');
      } else if (!flat && base) {
        const pf = (press === 'none') ? deco.slice() : [press].concat(deco);
        if (pf.length) focusDecls.push('  box-shadow: ' + pf.join(', ') + ';');
      }
    } else if (focus === 'invert' && style !== 'term' && !plate) {
      focusDecls.push('  color: ' + s.bg + ';');
      if (clip) {
        /* 取形款的填充长在 ::before 上，反色也得反那一层，否则会从多边形背后透出方块 */
        focusLayer.push('  background: ' + s.color + ';');
      } else {
        focusDecls.push('  background-color: ' + s.color + ';');
        if (bw > 0) focusDecls.push('  border-color: ' + s.bg + ';');
      }
    }

    if (plate) {
      L.push('');
      L.push('.brutal-field:focus-within .brutal-field__tag {');
      L.push('  background-color: ' + s.bg + ';');
      L.push('  color: ' + s.color + ';');
      L.push('}');
    }
    if (focusLayer.length) {
      L.push('.brutal-field:focus-within::before {');
      L = L.concat(focusLayer);
      L.push('}');
    }
    if (focusAfter.length) {
      L.push('.brutal-field:focus-within::after {');
      L = L.concat(focusAfter);
      L.push('}');
    }
    if (focusDecls.length) {
      L.push('');
      L.push('.brutal-field:focus-within {');
      L = L.concat(focusDecls);
      L.push('}');
    }

    return L;
  }

  /* ---------- BADGE ----------
     徽章与按钮的区别靠三件事拉开：① 内边距走自己的紧凑尺度（不共用按钮的 padX/padY）；
     ② 形状用缺角 / 尖角 / 锯齿 / 折角等几何取形；③ 自带前置标记。
     注意：clip-path 会把同一元素上的 box-shadow 一起剪掉，所以几何变体把填充放在
     ::before 上，硬影交给父级 filter: drop-shadow() —— 它按子层的实际轮廓出影。 */
  function markShape(mark) {
    switch (mark) {
      case 'square':
        return { w: .42, h: .42, decls: ['  background: currentColor;'] };
      case 'circle':
        return { w: .5, h: .5, decls: ['  background: currentColor;', '  border-radius: 50%;'] };
      case 'star':
        return { w: .66, h: .66, decls: ['  background: currentColor;',
                 '  clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);'] };
      case 'bolt':
        return { w: .44, h: .64, decls: ['  background: currentColor;',
                 '  clip-path: polygon(62% 0, 16% 54%, 44% 54%, 30% 100%, 84% 42%, 54% 42%);'] };
      case 'arrow':
        return { w: .52, h: .52, decls: ['  background: currentColor;',
                 '  clip-path: polygon(0 0, 100% 50%, 0 100%, 26% 50%);'] };
      case 'bar':
        return { w: .2, h: .68, decls: ['  background: currentColor;'] };
      default:
        return null;
    }
  }

  function cssBadge(s) {
    let L = [];
    const pattern = getPattern(s);
    const style = s.bdStyle || 'slab';
    const mark  = s.bdMark  || 'none';
    const bw    = s.borderWidth;
    const fs    = s.fontSize;
    const bx    = (s.bdPadX === undefined) ? 13 : s.bdPadX;
    const by    = (s.bdPadY === undefined) ? 6  : s.bdPadY;
    const base  = hasShadow(s) ? shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor) : null;

    /* 几何参数：全部随字号 / 内边距缩放，「字号」滑杆即整体放大缩小 */
    const boxH  = by * 2 + fs;                     /* 近似内容高度（line-height: 1） */
    const notch = Math.max(4, Math.round(boxH * 0.3));   /* 票券方缺口边长，按高度取三成 */
    const tip   = Math.round(fs * 0.9);            /* 缎带尖角伸出量 */
    const cut   = Math.round(fs * 0.62);           /* 折角边长 */
    const ampN  = fs * 0.26;                       /* 锯齿振幅（px） */
    const amp   = ampN.toFixed(1);
    const zigN  = 7;                               /* 锯齿齿数 */

    let padT = by, padR = bx, padB = by, padL = bx;
    let clip = null;          /* 交给 ::before 的形状层 */
    let viaFilter = false;    /* 硬影改走 filter: drop-shadow */
    let useBorder = true;
    let fill = true;
    let ringInner = 0;        /* 描边内侧再压一道细线（印刷标签感） */
    const extra = [];

    if (style === 'ticket') {
      useBorder = false; viaFilter = true;
      padL = Math.max(bx, notch + 5); padR = padL;
      clip = 'polygon(0 0, 100% 0,' +
             ' 100% calc(50% - ' + notch + 'px),' +
             ' calc(100% - ' + notch + 'px) calc(50% - ' + notch + 'px),' +
             ' calc(100% - ' + notch + 'px) calc(50% + ' + notch + 'px),' +
             ' 100% calc(50% + ' + notch + 'px),' +
             ' 100% 100%, 0 100%,' +
             ' 0 calc(50% + ' + notch + 'px),' +
             ' ' + notch + 'px calc(50% + ' + notch + 'px),' +
             ' ' + notch + 'px calc(50% - ' + notch + 'px),' +
             ' 0 calc(50% - ' + notch + 'px))';

    } else if (style === 'banner') {
      useBorder = false; viaFilter = true;
      padL = Math.max(bx + 4, tip + 2); padR = padL;
      clip = 'polygon(' + tip + 'px 0, calc(100% - ' + tip + 'px) 0, 100% 50%,' +
             ' calc(100% - ' + tip + 'px) 100%, ' + tip + 'px 100%, 0 50%)';

    } else if (style === 'zigzag') {
      useBorder = false; viaFilter = true;
      padT = Math.max(by, Math.ceil(ampN) + 1);   /* 齿深之上再留 1px，免得咬到文字 */
      padB = padT;
      const N = zigN;
      const pts = ['0 0'];
      for (let i = 0; i < N; i++) {
        pts.push(((i + .5) / N * 100).toFixed(2) + '% ' + amp + 'px');
        pts.push(((i + 1) / N * 100).toFixed(2) + '% 0');
      }
      pts.push('100% 100%');
      for (let i = 0; i < N; i++) {
        pts.push((100 - (i + .5) / N * 100).toFixed(2) + '% calc(100% - ' + amp + 'px)');
        pts.push((100 - (i + 1) / N * 100).toFixed(2) + '% 100%');
      }
      clip = 'polygon(' + pts.join(', ') + ')';

    } else if (style === 'fold') {
      useBorder = false; viaFilter = true;
      padR = Math.max(bx, cut + 4); padB = Math.max(by, 2);
      clip = 'polygon(0 0, 100% 0, 100% calc(100% - ' + cut + 'px),' +
             ' calc(100% - ' + cut + 'px) 100%, 0 100%)';

    } else if (style === 'stamp') {
      /* 透明底 + 粗描边 + 虚线外圈，像盖上去的一枚印；未指定角度时默认歪 3° 才像手盖的 */
      fill = false;
      extra.push('  outline: ' + Math.max(1, Math.round(bw * 0.6)) + 'px dashed ' + s.borderColor + ';');
      extra.push('  outline-offset: 3px;');
      extra.push('  transform: rotate(' + (s.rotate !== 0 ? s.rotate : -3) + 'deg);');

    } else if (style === 'outline') {
      fill = false;
      viaFilter = false;                     /* 空章不出影，靠描边立住 */

    } else if (style === 'side') {
      /* 只留左侧一条粗标条，上/右/下描边全去掉 —— 读起来是"色标贴条"而不是"可点的块" */
      const barW = Math.max(8, Math.round(bw * 2));
      useBorder = false;
      padL = Math.max(bx, barW + 7);
      extra.push('  border-left: ' + barW + 'px solid ' + s.borderColor + ';');

    } else {
      /* slab 硬块标签：描边内侧再压一道细线 —— 双线印刷感，和按钮的单线+投影区分开 */
      if (bw > 0) ringInner = Math.max(2, Math.round(bw * 0.5));
    }

    L.push('.brutal-badge {');
    L.push('  position: relative;');
    if (clip) L.push('  isolation: isolate;');   /* 建独立层叠上下文，::before 才能安全置底 */
    L.push('  display: inline-flex;');
    L.push('  align-items: center;');
    L.push('  justify-content: center;');
    L.push('  gap: .45em;');
    L.push('  padding: ' + padT + 'px ' + padR + 'px ' + padB + 'px ' + padL + 'px;');
    if (clip) L.push('  background: transparent;');   /* 填充只交给形状层，元素自身留空 */
    else if (fill) L = L.concat(bgLines(s, pattern));
    else L.push('  background: transparent;');
    L.push('  color: ' + s.color + ';');
    if (useBorder) L = L.concat(borderLines(s));
    else L.push('  border: none;');
    L.push('  border-radius: ' + s.radius + 'px;');
    if (base && viaFilter) {
      L.push('  filter: drop-shadow(' + s.shadowX + 'px ' + s.shadowY + 'px ' +
             s.shadowBlur + 'px ' + s.shadowColor + ');');
    } else if (style !== 'outline') {
      const sh = [];
      if (base) sh.push(base);
      if (ringInner > 0) {
        /* 两道 inset 夹出"底色带 + 细线"：后画的那道只在更外圈露出，形成真正的双线 */
        const gap = Math.max(3, Math.round(bw * 1.2));
        sh.push('inset 0 0 0 ' + gap + 'px ' + s.bg);
        sh.push('inset 0 0 0 ' + (gap + ringInner) + 'px ' + s.borderColor);
      }
      if (sh.length) L.push('  box-shadow: ' + sh.join(', ') + ';');
    }
    L = L.concat(fontLines(s));
    L.push('  line-height: 1;');
    L.push('  white-space: nowrap;');
    L.push('  user-select: none;');
    if (s.rotate !== 0 && style !== 'stamp') L.push('  transform: rotate(' + s.rotate + 'deg);');
    L = L.concat(extra);
    L.push('}');

    /* 形状层：只给几何取形的变体输出，垫在文字之下承载填充与纹理 */
    if (clip) {
      L.push('');
      L.push('.brutal-badge::before {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  inset: 0;');
      L.push('  z-index: -1;');       /* 垫到文字之下（靠父级 isolation 兜住） */
      L = L.concat(bgLines(s, pattern));
      L.push('  clip-path: ' + clip + ';');
      L.push('}');
    }

    /* 前置标记：order:-1 让 ::after 排到文字之前，间距交给容器的 gap */
    const mk = (mark && mark !== 'none') ? markShape(mark) : null;
    if (mk) {
      L.push('');
      L.push('.brutal-badge::after {');
      L.push("  content: '';");
      L.push('  order: -1;');
      L.push('  flex: 0 0 auto;');
      L.push('  width: ' + mk.w + 'em;');
      L.push('  height: ' + mk.h + 'em;');
      L = L.concat(mk.decls);
      L.push('}');
    }

    return L;
  }

  /* =========================================================
     单选组（radio）
     ---------------------------------------------------------
     单选组是「一组里挑一个」：差异必须落在"选中长什么样"上，
     而不是换个投影了事。六款：标记取形（box · dot）/ 整行表态
     （invert · stamp）/ 分区（dash）/ 内腔填实（skew）。
     ========================================================= */
  function cssRadio(s) {
    const style  = RD_STYLES[s.rdStyle] ? s.rdStyle : 'box';
    const pattern = getPattern(s);
    const bw     = Math.max(0, s.borderWidth);
    const size   = Math.max(12, s.rdSize === undefined ? 22 : s.rdSize);
    const gap    = Math.max(0, s.rdGap === undefined ? 10 : s.rdGap);
    const w      = Math.max(140, s.rdW || 260);
    const ease   = 'cubic-bezier(.34, 1.56, .64, 1)';
    const shadow = shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor);
    const hs     = hasShadow(s);
    const hoverS = hoverShadow(s);
    const inner  = Math.max(4, size - bw * 2);
    const markW  = Math.max(4, Math.round(inner * 0.56));
    /* 标条必须明显宽于边框 —— 8px 挨着 4px 边框只是"左边粗一点"，一眼看不出是变体 */
    const barW   = Math.max(16, Math.round(bw * 3));
    const padV   = Math.max(6, Math.round(size * 0.4));
    const padH   = Math.max(10, Math.round(size * 0.55));
    const padL   = (style === 'dash') ? Math.max(padH, barW + 10) : padH;
    const markRing = (style === 'skew');   /* skew 走"实心外块 + 内腔"两片叠出空心斜框 */

    /* 两态骨架：OFF 未选 / ON 选中。差异只写进这两只对象，
       下面负责把对象翻译成 CSS —— 和复选框同一个套路 */
    const OFF = { rowBg: '#ffffff', rowColor: s.color, markBg: '#ffffff',
                  markFill: 'transparent', rowShadow: hs ? shadow : null,
                  rowT: 'none', markR: s.radius + 'px', ring: 'solid', clip: null };
    const ON  = { rowBg: s.bg, rowColor: s.color, markBg: '#ffffff',
                  markFill: s.color, rowShadow: hs ? shadow : null,
                  rowT: 'none', markR: s.radius + 'px', ring: 'solid', clip: null };

    if (style === 'dot') {
      OFF.markR = '50%'; ON.markR = '50%';
    } else if (style === 'dash') {
      OFF.markR = '0px'; ON.markR = '0px';
    } else if (style === 'invert') {
      ON.rowBg = s.color; ON.rowColor = s.bg;
      ON.markBg = s.color; ON.markFill = s.bg;
    } else if (style === 'skew') {
      const cut = 'polygon(24% 0, 100% 0, 76% 100%, 0 100%)';
      OFF.markR = '0px'; ON.markR = '0px';
      OFF.clip = cut; ON.clip = cut;
    } else if (style === 'stamp') {
      /* 印章：整行不变色（否则和 invert 长得一样），靠「实线内框 + 虚线外圈 + 歪斜」表态 */
      OFF.ring = 'dashed';
      ON.rowBg = '#ffffff'; ON.rowColor = s.color;
      ON.markBg = '#ffffff'; ON.markFill = s.color;
      ON.rowT = 'rotate(-1.5deg)';
      ON.ringOut = true;
    }

    let L = [];

    L.push('.brutal-radio {');
    L.push('  display: inline-flex;');
    L.push('  flex-direction: column;');
    L.push('  gap: ' + gap + 'px;');
    L.push('  width: ' + w + 'px;');
    L.push('  box-sizing: border-box;');
    L.push('  color: ' + s.color + ';');
    L = L.concat(fontLines(s));
    L.push('  line-height: 1;');
    L.push('  user-select: none;');
    L.push('}');

    L.push('');
    L.push('.brutal-radio__opt {');
    L.push('  position: relative;');
    L.push('  display: flex;');
    L.push('  align-items: center;');
    L.push('  gap: ' + gap + 'px;');
    L.push('  box-sizing: border-box;');
    L.push('  padding: ' + padV + 'px ' + padH + 'px ' + padV + 'px ' + padL + 'px;');
    L.push('  background: #ffffff;');
    L.push('  color: ' + OFF.rowColor + ';');
    L.push('  border: ' + bw + 'px ' + OFF.ring + ' ' + s.borderColor + ';');
    L.push('  border-radius: ' + s.radius + 'px;');
    if (OFF.rowShadow) L.push('  box-shadow: ' + OFF.rowShadow + ';');
    L.push('  cursor: pointer;');
    L.push('  transform: ' + OFF.rowT + ';');
    L.push('  transition: background-color .16s ' + ease + ', color .16s ' + ease +
           ', box-shadow .16s ' + ease + ', transform .16s ' + ease + ';');
    L.push('}');

    /* 视觉隐藏真 input：用 opacity 而不是 display:none ——
       display:none 的元素不可聚焦，Tab 键就永远走不到单选组 */
    L.push('');
    L.push('.brutal-radio__input {');
    L.push('  position: absolute;');
    L.push('  width: 1px;');
    L.push('  height: 1px;');
    L.push('  opacity: 0;');
    L.push('  margin: 0;');
    L.push('  pointer-events: none;');
    L.push('}');

    L.push('');
    L.push('.brutal-radio__mark {');
    L.push('  position: relative;');
    L.push('  flex: 0 0 auto;');
    L.push('  display: block;');
    L.push('  width: ' + size + 'px;');
    L.push('  height: ' + size + 'px;');
    L.push('  box-sizing: border-box;');
    if (markRing) {
      /* 实心外块被 clip-path 取形，自身边框会被一起剪掉 —— 所以边框改由内腔让位表现 */
      L.push('  background: ' + s.borderColor + ';');
      L.push('  border: none;');
      L.push('  clip-path: ' + OFF.clip + ';');
    } else {
      L.push('  background: ' + OFF.markBg + ';');
      L.push('  border: ' + bw + 'px solid ' + s.borderColor + ';');
      L.push('  border-radius: ' + OFF.markR + ';');
    }
    L.push('}');

    if (markRing) {
      L.push('');
      L.push('.brutal-radio__mark::before {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  inset: ' + Math.max(2, bw) + 'px;');
      L.push('  background: #ffffff;');
      L.push('  clip-path: ' + OFF.clip + ';');
      L.push('  transition: background .16s ' + ease + ';');
      L.push('}');
      L.push('.brutal-radio__opt:has(input:checked) .brutal-radio__mark::before {');
      L.push('  background: ' + (style === 'invert' ? s.bg : s.color) + ';');
      L.push('}');
    } else {
      L.push('');
      L.push('.brutal-radio__mark::before {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  left: 50%;');
      L.push('  top: 50%;');
      L.push('  width: ' + markW + 'px;');
      L.push('  height: ' + markW + 'px;');
      L.push('  border-radius: ' + OFF.markR + ';');
      L.push('  background: ' + OFF.markFill + ';');
      L.push('  transform: translate(-50%, -50%) scale(.4);');
      L.push('  transition: transform .16s ' + ease + ', background .16s ' + ease + ';');
      L.push('}');
    }

    /* 选中态：整行表态 */
    L.push('');
    L.push('.brutal-radio__opt:has(input:checked) {');
    L.push('  background-color: ' + ON.rowBg + ';');
    if (pattern) {
      L.push('  background-image: ' + pattern.image + ';');
      L.push('  background-size: ' + pattern.size + ';');
    }
    L.push('  color: ' + ON.rowColor + ';');
    if (ON.ring !== 'solid') L.push('  border-style: ' + ON.ring + ';');
    if (ON.ringOut) {
      L.push('  outline: ' + Math.max(1, Math.round(bw * 0.6)) + 'px dashed ' + s.borderColor + ';');
      L.push('  outline-offset: 3px;');
    }
    L.push('  transform: ' + ON.rowT + ';');
    L.push('}');
    if (!markRing) {
      L.push('.brutal-radio__opt:has(input:checked) .brutal-radio__mark {');
      L.push('  background: ' + ON.markBg + ';');
      L.push('  border-radius: ' + ON.markR + ';');
      L.push('}');
      L.push('.brutal-radio__opt:has(input:checked) .brutal-radio__mark::before {');
      L.push('  background: ' + ON.markFill + ';');
      L.push('  transform: translate(-50%, -50%) scale(1);');
      L.push('}');
    }

    /* dash 的左侧粗标条：绝对定位实心块。
       不能用 border-left-width —— 那只是"左边界粗一点"，一眼看不出是变体 */
    if (style === 'dash') {
      L.push('');
      L.push('.brutal-radio__opt::after {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  top: 0;');
      L.push('  bottom: 0;');
      L.push('  left: 0;');
      L.push('  width: ' + barW + 'px;');
      L.push('  background: ' + s.color + ';');
      L.push('  transform: scaleY(0);');
      L.push('  transform-origin: center;');
      L.push('  transition: transform .16s ' + ease + ';');
      L.push('}');
      L.push('.brutal-radio__opt:has(input:checked)::after {');
      L.push('  transform: scaleY(1);');
      L.push('}');
    }

    /* 悬停 / 按下写在根上：矩阵的状态类是打在根元素上的，
       写成 .brutal-radio__opt:hover 的话矩阵那一格不会有任何变化 */
    L.push('');
    L.push('.brutal-radio:hover .brutal-radio__opt {');
    L.push('  box-shadow: ' + hoverS + ';');
    L.push('}');
    L.push('.brutal-radio:active .brutal-radio__opt {');
    L.push('  transform: translate(2px, 2px);');
    L.push('  box-shadow: none;');
    L.push('}');

    return L;
  }

  /* =========================================================
     进度条（progress）
     ========================================================= */
  function cssProgress(s) {
    const style  = PG_STYLES[s.pgStyle] ? s.pgStyle : 'slab';
    const pattern = getPattern(s);
    const bw     = Math.max(0, s.borderWidth);
    const v      = Math.max(0, Math.min(100, Number(s.pgValue) || 0));
    const w      = Math.max(160, s.pgW || 320);
    const h      = Math.max(8, s.pgH || 26);
    const shadow = shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor);
    const hs     = hasShadow(s);
    const hoverS = hoverShadow(s);
    const ink    = hexToRgba(s.color, 0.45);
    const ease   = 'cubic-bezier(.34, 1.56, .64, 1)';
    const seg    = Math.max(8, Math.round(h * 0.85));      /* 分段格宽 */
    const notch  = Math.max(6, Math.round(h * 0.5));       /* 箭头伸出量 */
    const gap1   = Math.max(3, Math.round(bw * 1.2));      /* 双线内框间距 */

    /* 填充层纹理（叠在填充色之上） */
    const fImg = [], fSize = [];
    if (style === 'stripe') {
      fImg.push('repeating-linear-gradient(45deg, transparent 0 5px, ' +
                hexToRgba(s.color, 0.32) + ' 5px 10px)');
      fSize.push('auto');
    } else if (style === 'segment') {
      fImg.push('repeating-linear-gradient(90deg, transparent 0 ' + (seg - Math.max(1, bw)) +
                'px, ' + s.borderColor + ' ' + (seg - Math.max(1, bw)) + 'px ' + seg + 'px)');
      fSize.push('auto');
    }
    if (pattern) { fImg.push(pattern.image); fSize.push(pattern.size); }

    /* 轨道自身的纹理（tick 的刻度线画在填充之上，所以走 ::after） */
    const segLine = 'repeating-linear-gradient(90deg, transparent 0 ' + (seg - 2) + 'px, ' +
                    ink + ' ' + (seg - 2) + 'px ' + seg + 'px)';

    let L = [];

    L.push('.brutal-progress {');
    L.push('  display: inline-flex;');
    L.push('  flex-direction: column;');
    L.push('  gap: 8px;');
    L.push('  width: ' + w + 'px;');
    L.push('  box-sizing: border-box;');
    L.push('  color: ' + s.color + ';');
    L = L.concat(fontLines(s));
    L.push('  line-height: 1;');
    L.push('}');

    L.push('.brutal-progress__head {');
    L.push('  display: flex;');
    L.push('  align-items: baseline;');
    L.push('  justify-content: space-between;');
    L.push('  gap: 10px;');
    L.push('}');
    L.push('.brutal-progress__label:empty { display: none; }');
    L.push('.brutal-progress__val {');
    L.push('  flex: 0 0 auto;');
    L.push('  padding: ' + Math.max(2, Math.round(bw * 0.6)) + 'px ' +
           Math.max(6, Math.round(bw * 1.6)) + 'px;');
    L.push('  background: ' + s.bg + ';');
    L.push('  color: ' + s.color + ';');
    L.push('  border: ' + bw + 'px solid ' + s.borderColor + ';');
    L.push('  transition: background-color .16s ' + ease + ', color .16s ' + ease + ';');
    L.push('}');

    L.push('');
    L.push('.brutal-progress__track {');
    L.push('  position: relative;');
    L.push('  box-sizing: border-box;');
    L.push('  height: ' + (h + bw * 2) + 'px;');
    L.push('  overflow: hidden;');
    L.push('  background: #ffffff;');
    L.push('  border: ' + bw + 'px solid ' + s.borderColor + ';');
    L.push('  border-radius: ' + s.radius + 'px;');
    if (hs) L.push('  box-shadow: ' + shadow + ';');
    L.push('  transition: transform .16s ' + ease + ', box-shadow .16s ' + ease + ';');
    L.push('}');

    L.push('');
    L.push('.brutal-progress__fill {');
    L.push('  position: absolute;');
    L.push('  left: 0;');
    L.push('  top: 0;');
    L.push('  bottom: 0;');
    L.push('  width: ' + v + '%;');
    L.push('  background-color: ' + s.bg + ';');
    if (fImg.length) {
      L.push('  background-image: ' + fImg.join(', ') + ';');
      L.push('  background-size: ' + fSize.join(', ') + ';');
    }
    if (style === 'notch') {
      L.push('  clip-path: polygon(0 0, calc(100% - ' + notch + 'px) 0, 100% 50%,' +
             ' calc(100% - ' + notch + 'px) 100%, 0 100%);');
    }
    L.push('  transition: width .3s ' + ease + ';');
    L.push('}');

    /* tick：刻度线必须画在填充之上，否则会被填充整片盖住 */
    if (style === 'tick') {
      L.push('');
      L.push('.brutal-progress__track::after {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  inset: 0;');
      L.push('  background-image: ' + segLine + ';');
      L.push('  pointer-events: none;');
      L.push('}');
    }
    /* double：框内再压一道线（inset 两层夹出细线，与徽章双线同一手法） */
    if (style === 'double') {
      L.push('');
      L.push('.brutal-progress__track::after {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  inset: ' + gap1 + 'px;');
      L.push('  border: ' + Math.max(2, Math.round(bw * 0.5)) + 'px solid ' + s.borderColor + ';');
      L.push('  pointer-events: none;');
      L.push('}');
    }

    L.push('');
    L.push('.brutal-progress:hover .brutal-progress__val {');
    L.push('  background: ' + s.color + ';');
    L.push('  color: ' + s.bg + ';');
    L.push('}');
    L.push('.brutal-progress:hover .brutal-progress__track {');
    L.push('  box-shadow: ' + hoverS + ';');
    L.push('}');
    L.push('.brutal-progress:active .brutal-progress__track {');
    L.push('  transform: translate(2px, 2px);');
    L.push('  box-shadow: none;');
    L.push('}');

    return L;
  }

  /* =========================================================
     滑块（slider）
     ---------------------------------------------------------
     用真 <input type="range">：拖得动才算滑块。上妆靠 -webkit- 伪元素
     （Edge / Chrome 系；Firefox 要另补 ::-moz-range-track / ::-moz-range-thumb）。
     「已填充 / 未填充」的分界没法塞 DOM 子元素进轨道，用一层线性渐变在
     v% 处硬切一刀 —— 这是唯一稳的做法。
     ========================================================= */
  function cssSlider(s) {
    const style  = SL_STYLES[s.slStyle] ? s.slStyle : 'slab';
    const pattern = getPattern(s);
    const bw     = Math.max(0, s.borderWidth);
    const v      = Math.max(0, Math.min(100, Number(s.slValue) || 0));
    const w      = Math.max(160, s.slW || 320);
    const h      = Math.max(10, s.slH || 22);
    const shadow = shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor);
    const hs     = hasShadow(s);
    const hoverS = hoverShadow(s);
    const ease   = 'cubic-bezier(.34, 1.56, .64, 1)';
    const trackH = h + bw * 2;
    const knob   = Math.max(16, Math.round(h * 1.35));
    const thumbMT = Math.round((trackH - knob) / 2);
    const ink    = hexToRgba(s.color, 0.42);
    const seg    = Math.max(10, Math.round(h * 1.1));
    const gap1   = Math.max(3, Math.round(bw * 1.2));

    const filled = (style === 'invert') ? s.color : s.bg;
    const empty  = (style === 'invert') ? s.bg : '#ffffff';
    /* 填充用 var(--val) 驱动，拖拽时由 SLIDER_JS 实时更新 → 填充跟随滑块。

    L.push('.brutal-slider__input:focus::-moz-range-thumb {');

  /* =========================================================

     ---------------------------------------------------------

     ========================================================= */
  const SELECT_JS = `(function(){
  var doc = document;
  function closeAll(except){
    var a = doc.querySelectorAll('.brutal-select.is-open');
    for(var i=0;i<a.length;i++){ if(a[i]!==except){ a[i].classList.remove('is-open'); a[i].setAttribute('aria-expanded','false'); } }
  }
  function open(sel){
    closeAll(sel);
    sel.classList.add('is-open');
    sel.setAttribute('aria-expanded','true');
    var opts = sel.querySelectorAll('.brutal-select__opt');
    var cur = sel.querySelector('.brutal-select__opt[aria-selected="true"]') || opts[0] || null;
    sel._active = cur;
    for(var i=0;i<opts.length;i++){ opts[i].classList.toggle('is-active', opts[i]===cur); }
  }
  function close(sel){ sel.classList.remove('is-open'); sel.setAttribute('aria-expanded','false'); }
  function choose(sel, opt){
    var opts = sel.querySelectorAll('.brutal-select__opt');
    for(var i=0;i<opts.length;i++){ opts[i].removeAttribute('aria-selected'); }
    opt.setAttribute('aria-selected','true');
    var val = sel.querySelector('.brutal-select__value');
    if(val) val.textContent = opt.textContent;
    close(sel);
  }
  doc.addEventListener('click', function(e){
    var t = e.target;
    var sel = t && t.closest ? t.closest('.brutal-select') : null;
    if(!sel){ closeAll(null); return; }
    if(sel.hasAttribute('disabled') || sel.getAttribute('aria-disabled')==='true' || sel.classList.contains('is-disabled')) return;
    var opt = t && t.closest ? t.closest('.brutal-select__opt') : null;
    if(opt){ choose(sel, opt); return; }
    if(sel.classList.contains('is-open')) close(sel); else open(sel);
  });
  doc.addEventListener('keydown', function(e){
    var t = e.target;
    var sel = t && t.closest ? t.closest('.brutal-select') : null;
    if(!sel) return;
    if(sel.hasAttribute('disabled') || sel.getAttribute('aria-disabled')==='true' || sel.classList.contains('is-disabled')) return;
    if(e.key==='Escape'){ close(sel); sel.focus(); return; }
    var opts = [].slice.call(sel.querySelectorAll('.brutal-select__opt'));
    if(!opts.length) return;
    if(sel.classList.contains('is-open')){
      var idx = opts.indexOf(sel._active || opts[0]);
      if(e.key==='ArrowDown'){ e.preventDefault(); idx=Math.min(opts.length-1, idx+1); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); idx=Math.max(0, idx-1); }
      else if(e.key==='Home'){ e.preventDefault(); idx=0; }
      else if(e.key==='End'){ e.preventDefault(); idx=opts.length-1; }
      else if(e.key==='Enter' || e.key===' '){ e.preventDefault(); choose(sel, sel._active||opts[0]); return; }
      else return;
      sel._active = opts[idx];
      for(var i=0;i<opts.length;i++){ opts[i].classList.toggle('is-active', opts[i]===sel._active); }
      opts[idx].scrollIntoView({block:'nearest'});
    } else {
      if(e.key==='ArrowDown' || e.key==='Enter' || e.key===' '){ e.preventDefault(); open(sel); }
    }
  });
})();`;

  /* 滑块交互：拖拽时让填充（CSS var(--val)）与数值标签实时跟随滑块。

      var v = input.value;
      input.style.setProperty('--val', v + '%');
      var root = input.closest ? input.closest('.brutal-slider') : null;
      var val = root && root.querySelector('.brutal-slider__val');
      if(val) val.textContent = v;
    }
    doc.addEventListener('input', function(e){ sync(e.target); }, true);
    doc.querySelectorAll('.brutal-slider__input').forEach(sync);

  function cssSelect(s) {

    L.push('  color: ' + s.color + ';');
    if (useBorder) L.push('  border: ' + bw + 'px solid ' + s.borderColor + ';');
