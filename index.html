<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="Xx4sA09F9GS3GreQHGr5od">
<head data-page-node-id="j04XUT3y11RoDv7K3LNhcN">
<meta charset="UTF-8" data-page-node-id="f7zbBkvQAt5YC2UcDN2IFc">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="PzUGYsFqAZ73piYWFkcWOd">
<title>粗野主义生成器 · BRUTALIST GEN</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0a0a0a;
    --paper: #e9e5dc;
    --accent: #ffe94a;
    --neon: #8ed500;
    --hot: #ff5c39;
    --muted: #6b665c;
    --hard: 5px 5px 0 #0a0a0a;
  }

  html, body { height: 100%; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background-color: var(--paper);
    background-image:
      linear-gradient(rgba(10,10,10,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(10,10,10,.055) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ 顶栏 ============ */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    padding: 12px 18px;
    background: var(--ink);
    color: #fff;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .logo {
    width: 26px; height: 26px;
    background: var(--accent);
    border: 3px solid var(--accent);
    box-shadow: 3px 3px 0 var(--neon);
    flex: 0 0 auto;
  }
  .brand h1 {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  .brand .sub {
    font-size: 9px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #8f8a80;
    font-family: ui-monospace, Menlo, monospace;
  }
  .topbar .actions { display: flex; gap: 9px; }

  .btn-sm {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 8px 14px;
    background: #fff;
    color: var(--ink);
    border: 2px solid #fff;
    cursor: pointer;
    transition: transform .08s ease, background .12s ease, color .12s ease;
    white-space: nowrap;
  }
  .btn-sm:hover { background: var(--accent); border-color: var(--accent); }
  .btn-sm:active { transform: translate(2px, 2px); }
  .btn-sm.ghost { background: transparent; color: #fff; border-color: #fff; }
  .btn-sm.ghost:hover { background: var(--neon); color: var(--ink); border-color: var(--neon); }

  /* ============ 模式栏 ============ */
  /* 十个模式挤一行。原来用 flex-wrap 换行 —— 一换行就把下面的预览区
     整体推下去，而且选中的那个可能已经被推到第二行看不见了。
     改成 nowrap + 横向滚动：高度恒定，选中项自动滚进视野。 */
  .modebar {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    padding: 12px 18px;
    background: var(--ink);
    border-top: 1px solid #2a2a26;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: #3a3a35 transparent;
  }
  .modebar::-webkit-scrollbar {
    height: 6px;
  }
  .modebar::-webkit-scrollbar-track {
    background: transparent;
  }
  .modebar::-webkit-scrollbar-thumb {
    background: #3a3a35;
  }
  .modebar::-webkit-scrollbar-thumb:hover {
    background: #6b665c;
  }
  /* 标签写的是中文，但原来那套排版是照英文大写配的：
     text-transform:uppercase 对中文完全无效，letter-spacing:.14em 把
     中文挤成一团，ui-monospace 对中文也不生效，10px 又偏小。
     换成中文友好的无衬线 + 12px + 微字距，再把款式数做成小徽标。 */
  .mode-tab {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .03em;
    padding: 9px 14px;
    background: transparent;
    color: #8f8a80;
    border: 2px solid #3a3a35;
    cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease, box-shadow .12s ease;
    white-space: nowrap;
  }
  .mode-tab__n {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 10px;
    font-weight: 800;
    line-height: 1;
    padding: 2px 5px;
    background: #2a2a26;
    color: #a8a29a;
    border: 1px solid #3a3a35;
  }
  .mode-tab:hover {
    color: #fff;
    border-color: #8f8a80;
  }
  .mode-tab.active {
    background: var(--accent);
    color: var(--ink);
    border-color: var(--accent);
    box-shadow: 3px 3px 0 var(--neon);
  }
  .mode-tab.active .mode-tab__n {
    background: var(--ink);
    color: var(--accent);
    border-color: var(--ink);
  }
  /* 键盘走到哪必须看得见 —— 原来只有鼠标 hover 有反馈，纯键盘用会"失明" */
  .mode-tab:focus-visible {
    outline: 3px solid var(--neon);
    outline-offset: 2px;
    color: #fff;
  }
  .mode-tab.active:focus-visible {
    color: var(--ink);
  }

  /* ============ 布局 ============ */
  .app {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 340px minmax(0, 1fr);
    gap: 16px;
    padding: 16px;
  }

  /* ============ 控制面板 ============ */
  .panel {
    background: #fff;
    border: 3px solid var(--ink);
    box-shadow: var(--hard);
    padding: 16px;
    overflow-y: auto;
    min-height: 0;
  }
  .panel::-webkit-scrollbar { width: 12px; }
  .panel::-webkit-scrollbar-track { background: var(--paper); border-left: 2px solid var(--ink); }
  .panel::-webkit-scrollbar-thumb { background: var(--ink); border: 2px solid var(--paper); }
  .panel::-webkit-scrollbar-thumb:hover { background: var(--hot); }

  .group + .group {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 3px dashed #cdc7ba;
  }
  .group h2 {
    display: inline-block;
    margin-bottom: 14px;
    padding: 3px 9px;
    background: var(--ink);
    color: var(--accent);
    font-family: ui-monospace, Menlo, monospace;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: .22em;
    text-transform: uppercase;
  }

  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }

  .field > label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #33302b;
  }
  .val {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 10px;
    font-weight: 800;
    color: var(--hot);
    font-variant-numeric: tabular-nums;
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .panel input[type="text"], .panel select {
    width: 100%;
    padding: 9px 10px;
    border: 2.5px solid var(--ink);
    border-radius: 0;
    background: #fff;
    color: var(--ink);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .04em;
  }
  .panel select { cursor: pointer; }
  .panel input[type="text"]:focus, .panel select:focus {
    outline: 3px solid var(--accent);
    outline-offset: 0;
  }

  /* 色板 */
  .panel input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 36px;
    padding: 0;
    border: 2.5px solid var(--ink);
    border-radius: 0;
    background: #fff;
    cursor: pointer;
    display: block;
  }
  .panel input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .panel input[type="color"]::-webkit-color-swatch { border: none; }
  .panel input[type="color"]::-moz-color-swatch { border: none; }
  .panel input[type="color"]:focus { outline: 3px solid var(--accent); }

  /* 滑杆 */
  .panel input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 22px;
    background: transparent;
    cursor: pointer;
    display: block;
  }
  .panel input[type="range"]::-webkit-slider-runnable-track {
    height: 11px;
    background: var(--paper);
    border: 2.5px solid var(--ink);
  }
  .panel input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 21px;
    margin-top: -7px;
    background: var(--accent);
    border: 2.5px solid var(--ink);
    border-radius: 0;
    transition: background .1s;
  }
  .panel input[type="range"]:hover::-webkit-slider-thumb { background: var(--neon); }
  .panel input[type="range"]::-moz-range-track {
    height: 11px;
    background: var(--paper);
    border: 2.5px solid var(--ink);
  }
  .panel input[type="range"]::-moz-range-thumb {
    width: 15px;
    height: 21px;
    background: var(--accent);
    border: 2.5px solid var(--ink);
    border-radius: 0;
  }
  .panel input[type="range"]:focus::-webkit-slider-thumb { background: var(--hot); }

  /* 复选框 */
  .checks { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 6px; }
  .check {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
  }
  .check input[type="checkbox"] {
    -webkit-appearance: none;
    appearance: none;
    position: relative;
    width: 16px;
    height: 16px;
    margin: 0;
    background: #fff;
    border: 2.5px solid var(--ink);
    cursor: pointer;
    flex: 0 0 auto;
    transition: background .1s;
  }
  .check input[type="checkbox"]:checked { background: var(--neon); }
  .check input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    top: 1px; left: 4px;
    width: 4px; height: 8px;
    border: solid var(--ink);
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
  }
  .check:hover input[type="checkbox"] { background: var(--accent); }
  .check:hover input[type="checkbox"]:checked { background: var(--neon); }

  /* 预设 */
  .presets { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 7px 11px;
    background: #fff;
    color: var(--ink);
    border: 2.5px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    cursor: pointer;
    transition: transform .08s ease, box-shadow .08s ease, background .12s;
  }
  .chip:hover { background: var(--accent); transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--ink); }
  .chip:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }

  /* ============ 舞台 ============ */
  .stage {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
    min-width: 0;
  }

  .preview {
    position: relative; /* 供 .pattern-tag 绝对定位 */
    flex: 1 1 auto;
    min-height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 30px;
    background-color: #f7f4ec;
    background-image:
      linear-gradient(rgba(10,10,10,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(10,10,10,.07) 1px, transparent 1px);
    background-size: 24px 24px;
    border: 3px solid var(--ink);
    box-shadow: var(--hard);
    overflow: auto;
  }
  .preview::-webkit-scrollbar { width: 10px; height: 10px; }
  .preview::-webkit-scrollbar-thumb { background: var(--ink); }

  /* 五态矩阵（预览区专用，不属于生成的组件 CSS） */
  .mx-grid {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    align-content: center;
    padding-top: 38px;   /* 让开预览区左上角的纹理标签 */
  }
  .mx-grid--card,
  .mx-grid--input { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .mx-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    min-height: 128px;
    padding: 22px 10px 12px;
    border: 2px dashed rgba(10, 10, 10, .22);
  }
  .mx-stage {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-width: 0;
  }
  .mx-label {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  /* 预览区左上角的「当前纹理」标签（由 JS 每次 render 重建） */
  .pattern-tag {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--ink);
    color: var(--accent);
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--neon);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
  }
  .pattern-tag .pattern-tag__sw {
    width: 30px;
    height: 16px;
    flex: 0 0 auto;
    border: 2px solid var(--accent);
    background-color: #fff;
  }

  /* ============ 代码 ============ */
  .code-area {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    min-width: 0;
  }
  .code-block {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: #131310;
    border: 3px solid var(--ink);
    box-shadow: var(--hard);
  }
  .code-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px 6px 12px;
    background: var(--ink);
    color: var(--accent);
    font-family: ui-monospace, Menlo, monospace;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: .2em;
    text-transform: uppercase;
  }
  .copy {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 4px 10px;
    background: var(--accent);
    color: var(--ink);
    border: 2px solid var(--accent);
    cursor: pointer;
    transition: background .12s, border-color .12s, color .12s;
  }
  .copy:hover { background: var(--neon); border-color: var(--neon); }
  .copy:active { transform: translate(1px, 1px); }
  .code-block pre {
    margin: 0;
    padding: 12px 14px;
    max-height: 220px;
    overflow: auto;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace;
    font-size: 11.5px;
    line-height: 1.7;
    color: #e6e3da;
    white-space: pre;
    tab-size: 2;
  }
  .code-block pre::-webkit-scrollbar { width: 10px; height: 10px; }
  .code-block pre::-webkit-scrollbar-thumb { background: #3d3d38; border: 2px solid #131310; }

  /* ============ 顶栏动作分组 ============ */
  .act-group { display: flex; gap: 9px; align-items: center; }
  .act-group + .act-group { padding-left: 12px; border-left: 1px solid #3a3a35; }

  .btn-sm:disabled { opacity: .28; cursor: not-allowed; }
  .btn-sm:hover:disabled { background: transparent; border-color: #fff; color: #fff; }
  .btn-sm.ghost:hover:disabled { background: transparent; border-color: #fff; color: #fff; }

  /* 存档状态指示 */
  .save-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #8f8a80;
    white-space: nowrap;
  }
  .save-pill__dot {
    width: 8px; height: 8px;
    flex: 0 0 auto;
    background: var(--neon);
    transition: background .2s;
  }
  .save-pill.is-idle .save-pill__dot { background: #55524c; }

  /* 底部提示条 */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    z-index: 90;
    transform: translate(-50%, 16px);
    opacity: 0;
    pointer-events: none;
    padding: 10px 16px;
    background: var(--ink);
    color: var(--accent);
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--neon);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    transition: opacity .16s ease, transform .16s ease;
  }
  .toast.is-on { opacity: 1; transform: translate(-50%, 0); }

  /* ============ 画布底色 ============
     只作用于预览画布，绝不进生成的组件 CSS */
  .preview.pv-light { background-color: #ffffff; background-image: none; }
  .preview.pv-dark  { background-color: #141414; background-image: none; }
  .preview.pv-checker {
    background-color: #ffffff;
    background-image:
      linear-gradient(45deg, #d9d4c9 25%, transparent 25%, transparent 75%, #d9d4c9 75%),
      linear-gradient(45deg, #d9d4c9 25%, transparent 25%, transparent 75%, #d9d4c9 75%);
    background-size: 26px 26px;
    background-position: 0 0, 13px 13px;
  }
  /* 深底上把工具自带的外壳也翻过来，否则虚线格和标签全糊成一片 */
  .preview.pv-dark .mx-cell { border-color: rgba(255, 255, 255, .26); }
  .preview.pv-dark .mx-label { color: #a8a49c; }
  .preview.pv-dark .pattern-tag { background: var(--accent); color: var(--ink); border-color: var(--accent); box-shadow: 3px 3px 0 var(--ink); }
  .preview.pv-dark .pattern-tag .pattern-tag__sw { border-color: var(--ink); }

  /* ============ 设备宽度模拟 ============ */
  .pv-canvas {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .preview.is-dev { padding-left: 34px; padding-right: 34px; }
  .preview.is-dev .pv-canvas {
    width: 100%;
    max-width: var(--dev-w, 100%);
    padding: 26px 16px;
    border: 2px dashed rgba(10, 10, 10, .3);
    background: rgba(255, 255, 255, .42);
  }
  .preview.pv-dark.is-dev .pv-canvas {
    border-color: rgba(255, 255, 255, .3);
    background: rgba(255, 255, 255, .05);
  }
  .preview.is-dev::after {
    content: attr(data-dev);
    position: absolute;
    top: 14px; right: 14px;
    z-index: 2;
    padding: 6px 10px;
    background: var(--accent);
    color: var(--ink);
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: .18em;
    pointer-events: none;
    user-select: none;
  }

  /* ============ 代码语法高亮 ============ */
  .c-com  { color: #6f7a5e; font-style: italic; }
  .c-sel  { color: #ffd75e; }
  .c-prop { color: #8ed500; }
  .c-val  { color: #ff9d7a; }
  .c-num  { color: #ff5c39; }
  .c-at   { color: #00e0ff; }
  .c-var  { color: #c8a2ff; }
  .c-key  { color: #e6e3da; }
  .c-pun  { color: #8f8a80; }
  .c-tag  { color: #ffd75e; }
  .c-attr { color: #8ed500; }

  /* ============ 工作台控件 ============ */
  .chip.is-on {
    background: var(--accent);
    transform: translate(3px, 3px);
    box-shadow: 0 0 0 var(--ink);
  }
  .chip.is-on:hover { background: var(--neon); }
  .hint {
    margin-top: 12px;
    font-size: 9.5px;
    line-height: 1.65;
    letter-spacing: .02em;
    color: #8a857a;
  }

  /* ============ 响应式 ============ */
  @media (max-width: 920px) {
    html, body { height: auto; }
    .app {
      grid-template-columns: 1fr;
      padding: 12px;
      gap: 12px;
    }

  function hexToRgba(hex, alpha) {
    let h = String(hex).replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    if (h.length !== 6) return 'rgba(0,0,0,' + alpha + ')';
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
  }

  function shadowStr(x, y, b, color) {
    if (x === 0 && y === 0 && b === 0) return 'none';
    return x + 'px ' + y + 'px ' + b + 'px ' + color;
  }

  function hasShadow(s) {
    return !(s.shadowX === 0 && s.shadowY === 0 && s.shadowBlur === 0);
  }

  /* 相对亮度 + 对比色挑选：滑块图标压在滑块上，自动选对比更强的那个色 */
  function luminance(hex) {
    let h = String(hex).replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    if (h.length !== 6) return 0.5;
    const ch = [0, 2, 4].map(function (i) {
      const v = parseInt(h.slice(i, i + 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  }

  function contrastOn(baseHex, a, b) {
    const lb = luminance(baseHex);
    return Math.abs(lb - luminance(a)) >= Math.abs(lb - luminance(b)) ? a : b;
  }

  /* ---------------- 背景纹理 ----------------
     alpha 默认为 0.16（正文用，很淡）；缩略图可以传更大的值让它看得清 */
  function getPattern(s, alpha) {
    const a = (alpha === undefined) ? 0.16 : alpha;
    const ink = hexToRgba(s.color, a);
    switch (s.pattern) {
      case 'stripes':
        return {
          image: 'repeating-linear-gradient(45deg, transparent 0 7px, ' + ink + ' 7px 14px)',
          size: 'auto'
        };
      case 'grid':
        return {
          image: 'linear-gradient(' + ink + ' 1.5px, transparent 1.5px), ' +
                 'linear-gradient(90deg, ' + ink + ' 1.5px, transparent 1.5px)',
          size: '13px 13px'
        };
      case 'dots':
        return {
          image: 'radial-gradient(' + ink + ' 1.6px, transparent 1.8px)',
          size: '11px 11px'
        };
      default:
        return null;
    }
  }

  /* ---------------- 背景属性行 ---------------- */
  function bgLines(s, pattern, indent) {
    const p = indent || '  ';
    if (pattern) {
      return [
        p + 'background-color: ' + s.bg + ';',
        p + 'background-image: ' + pattern.image + ';',
        p + 'background-size: ' + pattern.size + ';'
      ];
    }
    return [p + 'background: ' + s.bg + ';'];
  }

  /* ---------------- 边框属性行 ---------------- */
  function borderLines(s, indent) {
    const p = indent || '  ';
    if (s.borderWidth > 0) {
      return [p + 'border: ' + s.borderWidth + 'px solid ' + s.borderColor + ';'];
    }
    return [p + 'border: none;'];
  }

  /* ---------------- 字体属性行 ---------------- */
  function fontLines(s, indent, sizeOverride) {
    const p = indent || '  ';
    const fs = sizeOverride || s.fontSize;
    const L = [
      p + 'font-family: ' + FONTS[s.fontFamily] + ';',
      p + 'font-size: ' + fs + 'px;',
      p + 'font-weight: ' + s.fontWeight + ';',
      p + 'letter-spacing: ' + s.letterSpacing + 'px;'
    ];
    if (s.uppercase) L.push(p + 'text-transform: uppercase;');
    return L;
  }

  /* ---------------- 阴影 + 旋转属性行 ---------------- */
  function boxLines(s, indent) {
    const p = indent || '  ';
    let L = [];
    if (hasShadow(s)) L.push(p + 'box-shadow: ' + shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor) + ';');
    if (s.rotate !== 0) L.push(p + 'transform: rotate(' + s.rotate + 'deg);');
    return L;
  }

  /* ---------------- 计算悬停阴影 ---------------- */
  function hoverShadow(s) {
    let hx = s.shadowX, hy = s.shadowY, hb = s.shadowBlur;
    if (s.hoverGrowShadow) {
      hx = Math.round(hx * 1.6);
      hy = Math.round(hy * 1.6);
      hb = Math.round(hb * 1.6);
    }
    if (s.hoverLift) hy += 6;
    return shadowStr(hx, hy, hb, s.shadowColor);
  }

  /* =========================================================
     CSS 生成 · 各模式
     ========================================================= */

  /* ---------- BUTTON ----------
     按钮是「动作」：差异落在轮廓与体量上，而不是换个投影了事：
       solid   硬块（实心 + 硬边框 + 硬影，基准款）
       outline 空描边（默认透明底，悬停才填实）
       double  双线硬框（外边框 + inset 内框，硬影仍在）
       skew    斜切块（平行四边形）
       corner  切角块（左上 / 右下切角）
       rail    侧栏标条（左侧一条粗标条）
       bracket 四角夹框（无边框，四只 L 角夹从外侧夹住，硬影保留）
       push    厚底立体（底部厚边，按下真的压下去）
     取形款（skew / corner）的 clip-path 会把同一元素的 border 与 box-shadow
     一起剪掉，所以它们是无边框无影的纯色块 —— 靠形状说话。 */
  function cssButton(s) {
    let L = [];
    const pattern   = getPattern(s);
    const style     = s.btnStyle || 'solid';
    const bw        = s.borderWidth;
    const r         = s.radius;
    const hasIcon   = !!(BTN_ICONS[s.btnIcon] && s.btnIcon !== 'none');
    const iconRight = (s.btnIconPos !== 'left');
    const clip      = (style === 'skew' || style === 'corner');

    /* 变体量纲 */
    const cut   = Math.max(10, Math.round(s.fontSize * 0.85));
    const sk    = Math.max(9,  Math.round(s.fontSize * 0.65));
    const thick = Math.max(6,  bw + 4);
    const barW  = Math.max(16, Math.round(bw * 5));
    const gap   = Math.max(3,  bw);
    const armL  = Math.max(14, Math.round(s.fontSize * 1.05));
    const armW  = Math.max(5,  Math.round(bw * 1.4));

    /* padding 让位给装饰 */
    let padT = s.padY, padR = s.padX, padB = s.padY, padL = s.padX;
    if (style === 'rail')    padL += barW;
    if (style === 'double')  { padT += gap + bw; padR += gap + bw; padB += gap + bw; padL += gap + bw; }
    if (style === 'bracket') { padT += armW; padR += armW; padB += armW; padL += armW; }

    /* 完整 transform：用户设定的 rotate 在任何状态下都得带着 */
    const tf = function (extra) {
      let p = [];
      if (s.rotate !== 0) p.push('rotate(' + s.rotate + 'deg)');
      if (extra && extra.length) p = p.concat(extra);
      return p.length ? p.join(' ') : 'none';
    };

    /* ---------------- 基础块 ---------------- */
    L.push('.brutal-btn {');
    L.push('  position: relative;');
    L.push('  display: inline-flex;');
    L.push('  align-items: center;');
    L.push('  justify-content: center;');
    L.push('  gap: .46em;');
    L.push('  box-sizing: border-box;');
    L.push('  padding: ' + padT + 'px ' + padR + 'px ' + padB + 'px ' + padL + 'px;');
    L.push('  color: ' + s.color + ';');

    if (style === 'outline') {
      L.push('  background: transparent;');
    } else {
      L = L.concat(bgLines(s, pattern, '  '));
    }

    if (clip || style === 'bracket') {
      L.push('  border: none;');
    } else if (style === 'rail') {
      L.push('  border: ' + bw + 'px solid ' + s.borderColor + ';');
    } else {
      L = L.concat(borderLines(s, '  '));
    }

    if (!clip && r > 0) L.push('  border-radius: ' + r + 'px;');

    if (clip) {
      L.push('  clip-path: ' + (style === 'skew'
        ? 'polygon(' + sk + 'px 0, 100% 0, calc(100% - ' + sk + 'px) 100%, 0 100%)'
        : 'polygon(' + cut + 'px 0, 100% 0, 100% calc(100% - ' + cut + 'px), calc(100% - ' + cut + 'px) 100%, 0 100%, 0 ' + cut + 'px)') + ';');
    } else if (style === 'push') {
      L.push('  box-shadow: 0 ' + thick + 'px 0 0 ' + s.borderColor + ';');
    } else if (style === 'double') {
      const sh = [];
      if (hasShadow(s)) sh.push(shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor));
      sh.push('inset 0 0 0 ' + gap + 'px ' + s.bg);
      sh.push('inset 0 0 0 ' + (gap + bw) + 'px ' + s.borderColor);
      L.push('  box-shadow: ' + sh.join(', ') + ';');
    } else if (style !== 'outline' && hasShadow(s)) {
      L.push('  box-shadow: ' + shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor) + ';');
    }

    if (s.rotate !== 0) L.push('  transform: rotate(' + s.rotate + 'deg);');

    L = L.concat(fontLines(s, '  '));
    L.push('  line-height: 1;');
    L.push('  text-decoration: none;');
    L.push('  cursor: pointer;');
    L.push('  user-select: none;');
    L.push('  -webkit-tap-highlight-color: transparent;');
    L.push('  transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease, color .15s ease, border-color .15s ease;');
    L.push('}');

    /* ---------------- 侧栏标条：左侧一条实心粗标条 ----------------
       （早先用 border-left-width 加粗，结果只是"左边界粗一点"，看不出标条） */
    if (style === 'rail') {
      L.push('');
      L.push('.brutal-btn::before {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  top: 0;');
      L.push('  bottom: 0;');
      L.push('  left: 0;');
      L.push('  width: ' + barW + 'px;');
      L.push('  background: ' + s.borderColor + ';');
      L.push('  pointer-events: none;');
      L.push('}');
    }

    /* ---------------- 四角夹框：8 层背景拼出四只 L 角 ---------------- */
    if (style === 'bracket') {
      const lg = 'linear-gradient(' + s.borderColor + ', ' + s.borderColor + ')';
      const vl = armL + 'px', vw = armW + 'px';
      L.push('');
      L.push('.brutal-btn::before {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  inset: -' + armW + 'px;');
      L.push('  pointer-events: none;');
      L.push('  background-image: ' + [lg, lg, lg, lg, lg, lg, lg, lg].join(', ') + ';');
      L.push('  background-size: ' + [vl + ' ' + vw, vw + ' ' + vl, vl + ' ' + vw, vw + ' ' + vl,
                                     vl + ' ' + vw, vw + ' ' + vl, vl + ' ' + vw, vw + ' ' + vl].join(', ') + ';');
      L.push('  background-position: 0 0, 0 0, 100% 0, 100% 0, 0 100%, 0 100%, 100% 100%, 100% 100%;');
      L.push('  background-repeat: no-repeat;');
      L.push('}');
    }

    /* ---------------- 图标（纯 CSS 形状，跟随 currentColor） ---------------- */
    if (hasIcon) {
      L.push('');
      L.push('.brutal-btn__icon {');
      L.push('  flex: 0 0 auto;');
      L.push('  width: .82em;');
      L.push('  height: .82em;');
      L.push('  background: currentColor;');
      if (s.btnIcon === 'dot') L.push('  border-radius: 50%;');
      else if (ICON_POLY[s.btnIcon]) L.push('  clip-path: ' + ICON_POLY[s.btnIcon] + ';');
      if (!iconRight) L.push('  order: -1;');
      L.push('}');
    }

    /* ---------------- 角标 ---------------- */
    if (s.badge) {
      L.push('');
      L.push('.brutal-btn::after {');
      L.push('  content: attr(data-badge);');
      L.push('  position: absolute;');
      L.push('  top: 0;');
      L.push('  right: 0;');
      L.push('  padding: 3px 7px;');
      L.push('  background: ' + s.color + ';');
      L.push('  color: ' + s.bg + ';');
      L.push('  font-family: ' + FONTS[s.fontFamily] + ';');
      L.push('  font-size: 9px;');
      L.push('  font-weight: 800;');
      L.push('  line-height: 1;');
      L.push('  letter-spacing: 0.12em;');
      L.push('  text-transform: uppercase;');
      L.push('  pointer-events: none;');
      L.push('}');
    }

    /* ---------------- 悬停 ---------------- */
    const hv = [];
    const straighten = s.hoverStraighten && s.rotate !== 0;
    const ex = [];
    if (style === 'skew') ex.push('translate(' + Math.round(sk * 0.4) + 'px, 0)');
    if (s.hoverLift) ex.push('translateY(-6px)');
    if (straighten || ex.length) {
      let tp = [];
      if (!straighten && s.rotate !== 0) tp.push('rotate(' + s.rotate + 'deg)');
      if (ex.length) tp = tp.concat(ex);
      hv.push('  transform: ' + (tp.length ? tp.join(' ') : 'none') + ';');
    }

    if (style === 'push') {
      hv.push('  box-shadow: 0 ' + Math.round(thick * 1.6) + 'px 0 0 ' + s.borderColor + ';');
    } else if (style === 'double') {
      const sh = [];
      if (hasShadow(s)) sh.push(shadowStr(Math.round(s.shadowX * 1.6),
                                          Math.round(s.shadowY * 1.6) + (s.hoverLift ? 6 : 0),
                                          s.shadowBlur, s.shadowColor));
      sh.push('inset 0 0 0 ' + gap + 'px ' + s.bg);
      sh.push('inset 0 0 0 ' + (gap + bw) + 'px ' + s.borderColor);
      hv.push('  box-shadow: ' + sh.join(', ') + ';');
    } else if (!clip && style !== 'outline' && hasShadow(s) && (s.hoverGrowShadow || s.hoverLift)) {
      hv.push('  box-shadow: ' + hoverShadow(s) + ';');
    }

    if (style === 'outline') {
      hv.push('  background: ' + s.bg + ';');
      if (pattern) {
        hv.push('  background-image: ' + pattern.image + ';');
        hv.push('  background-size: ' + pattern.size + ';');
      }
    } else if (clip) {
      hv.push('  background: ' + s.borderColor + ';');
      hv.push('  color: ' + s.bg + ';');
    } else if (s.hoverInvert) {
      hv.push('  background-color: ' + s.color + ';');
      hv.push('  color: ' + s.bg + ';');
      if (pattern) hv.push('  background-image: none;');
    }

    if (hv.length) {
      L.push('');
      L.push('.brutal-btn:hover {');
      L = L.concat(hv);
      L.push('}');
    }

    /* ---------------- 按下 ---------------- */
    if (s.pressShake) {
      L.push('');
      L.push('.brutal-btn:active {');
      L.push('  animation: brutal-shake 0.4s ease-in-out;');
      L.push('}');
      L.push('');
      L.push('@keyframes brutal-shake {');
      L.push('  0%, 100% { transform: ' + tf([]) + '; }');
      L.push('  25%      { transform: ' + tf(['translateX(-5px)']) + '; }');
      L.push('  50%      { transform: ' + tf(['translateX(5px)']) + '; }');
      L.push('  75%      { transform: ' + tf(['translateX(-3px)']) + '; }');
      L.push('}');
    } else {
      const av = [];
      if (style === 'push') {
        av.push('  transform: ' + tf(['translateY(' + thick + 'px)']) + ';');
        av.push('  box-shadow: 0 0 0 0 ' + s.borderColor + ';');
      } else if (clip || style === 'outline') {
        av.push('  transform: ' + tf(['translate(2px, 2px)']) + ';');
      } else if (style === 'double') {
        av.push('  transform: ' + tf(['translate(' + s.shadowX + 'px, ' + s.shadowY + 'px)']) + ';');
        av.push('  box-shadow: inset 0 0 0 ' + gap + 'px ' + s.bg + ', inset 0 0 0 ' +
                (gap + bw) + 'px ' + s.borderColor + ';');
      } else if (hasShadow(s)) {
        av.push('  transform: ' + tf(['translate(' + s.shadowX + 'px, ' + s.shadowY + 'px)']) + ';');
        av.push('  box-shadow: none;');
      }
      if (av.length) {
        L.push('');
        L.push('.brutal-btn:active {');
        L = L.concat(av);
        L.push('}');
      }
    }

    return L;
  }

  /* ---------- CARD ----------
     卡片是"面"，变体差异必须落在版式与轮廓上：
       slab    底线款（硬边框 + 硬投影 + 标题分隔线）
       band    通栏硬切：顶部实心墨色条，正文整体下移
       bracket 四角夹框：无边框无投影，四只 L 角夹从外侧夹住
       bevel   斜切双边：切掉左上 / 右下两只角，影走 drop-shadow
       notch   缺口票卡：左右两腰各咬一个方缺口
       stamp   印章双框：外框 + 内框双线 + 虚线外圈
       rail    侧栏标条：左侧一条粗标条
       tape    斜贴封条：左上 / 右下各贴一条斜封条
     clip-path 会吃掉同一元素自身的 box-shadow，所以取形款一律走
     「::before 承载填充与取形 + 父级 filter: drop-shadow 出硬影」。
     装饰性内框（inset 影）单独存进 deco，悬停换影时叠加而非覆盖。 */
  function cssCard(s) {
    let L = [];
    const pattern = getPattern(s);
    const style  = s.cardStyle || 'slab';
    const bw     = s.borderWidth;
    const fs     = s.fontSize;
    const W      = (s.cardW === undefined) ? 300 : s.cardW;
    const align  = (s.cardAlign === 'center') ? 'center' : 'left';
    const rule   = s.titleRule !== false;
    const cta    = s.ctaStyle || 'solid';
    const r      = s.radius;
    const tagR   = Math.min(r, 6);
    const base   = hasShadow(s) ? shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor) : null;
    const hShadow = hoverShadow(s);
    const needHover = s.hoverStraighten || s.hoverLift || s.hoverGrowShadow;

    /* —— 版式参数：全部随字号 / 边框粗细缩放 —— */
    const bandH = Math.max(26, Math.round(fs * 1.7));       /* 通栏条高 */
    const cut   = Math.max(14, Math.round(fs * 1.05));      /* 斜切边长 */
    const notch = Math.max(7,  Math.round(fs * 0.6));       /* 票券缺口深 */
    const barW  = Math.min(44, Math.max(16, Math.round(bw * 4)));  /* 侧栏标条宽（要显著粗于其余三边） */
    const ringG = Math.max(6,  Math.round(bw * 1.4));       /* 印章内框留白 */
    const ringW = Math.max(2,  Math.round(bw * 0.6));       /* 印章内框线宽 */
    const brL   = Math.max(22, Math.round(fs * 1.8));       /* 角夹边长 */
    const brT   = Math.max(2, bw);                          /* 角夹线粗 */
    const brOut = brT + 4;                                  /* 角夹外扩量 */

    let padT = s.padY, padR = s.padX, padB = s.padY, padL = s.padX;
    let clip = null;          /* 交给 ::before 的取形层 */
    let viaFilter = false;    /* 硬影改走 filter: drop-shadow */
    let flat = false;         /* 完全不出影 */
    let useBorder = true;
    let deco = [];            /* 装饰性阴影（inset 内框），与悬停影并存 */
    const extra = [];         /* 追加到 .brutal-card 的声明 */

    if (style === 'band') {
      padT = s.padY + bandH;                       /* 给顶条让位 */

    } else if (style === 'bracket') {
      useBorder = false; flat = true;              /* 靠角夹立住，不要边框与投影 */

    } else if (style === 'bevel') {
      useBorder = false; viaFilter = true;
      clip = 'polygon(' + cut + 'px 0, 100% 0, 100% calc(100% - ' + cut + 'px),' +
             ' calc(100% - ' + cut + 'px) 100%, 0 100%, 0 ' + cut + 'px)';

    } else if (style === 'notch') {
      useBorder = false; viaFilter = true;
      padL = Math.max(s.padX, notch + 8);          /* 缺口之上再留 8px，免得咬到文字 */
      padR = padL;
      clip = 'polygon(0 0, 100% 0,' +
             ' 100% calc(50% - ' + notch + 'px),' +
             ' calc(100% - ' + notch + 'px) calc(50% - ' + notch + 'px),' +
             ' calc(100% - ' + notch + 'px) calc(50% + ' + notch + 'px),' +
             ' 100% calc(50% + ' + notch + 'px),' +
             ' 100% 100%, 0 100%,' +
             ' 0 calc(50% + ' + notch + 'px),' +
             ' ' + notch + 'px calc(50% + ' + notch + 'px),' +
             ' ' + notch + 'px calc(50% - ' + notch + 'px),' +
             ' 0 calc(50% - ' + notch + 'px))';

    } else if (style === 'stamp') {
      deco.push('inset 0 0 0 ' + ringG + 'px ' + s.bg);
      deco.push('inset 0 0 0 ' + (ringG + ringW) + 'px ' + s.borderColor);
      extra.push('  outline: ' + Math.max(1, Math.round(bw * 0.5)) + 'px dashed ' + s.borderColor + ';');
      extra.push('  outline-offset: 5px;');

    } else if (style === 'rail') {
      useBorder = bw > 0;
      padL = Math.max(s.padX, barW + 12);
      extra.push('  border-left: ' + barW + 'px solid ' + s.borderColor + ';');
    }
    /* tape 不需要改版式，封条全在伪元素上 */
    void cut; void brOut;

    /* —— 影：装饰影（inset）与悬停影并存 —— */
    const shBase = [];
    if (!flat && !viaFilter && base) shBase.push(base);
    const shAll = shBase.concat(deco);

    L.push('.brutal-card {');
    L.push('  position: relative;');
    L.push('  box-sizing: border-box;');            /* cardW 即整体宽度（含内边距与边框） */
    if (clip) L.push('  isolation: isolate;');      /* 取形层要能安全垫底 */
    L.push('  flex: 0 0 auto;');                    /* 预览区是 flex 容器，别被压扁 */
    L.push('  width: ' + W + 'px;');
    L.push('  padding: ' + ((padT === padB && padR === padL)
      ? (padT === padR ? padT + 'px' : padT + 'px ' + padR + 'px')
      : (padT + 'px ' + padR + 'px ' + padB + 'px ' + padL + 'px')) + ';');
    if (clip) L.push('  background: transparent;'); /* 填充交给取形层 */
    else L = L.concat(bgLines(s, pattern));
    L.push('  color: ' + s.color + ';');
    if (useBorder) L = L.concat(borderLines(s));
    else L.push('  border: none;');
    L.push('  border-radius: ' + r + 'px;');
    if (viaFilter) {
      if (base) L.push('  filter: drop-shadow(' + s.shadowX + 'px ' + s.shadowY + 'px ' +
                       s.shadowBlur + 'px ' + s.shadowColor + ');');
    } else if (shAll.length) {
      L.push('  box-shadow: ' + shAll.join(', ') + ';');
    }
    L = L.concat(fontLines(s));
    L.push('  line-height: 1.5;');
    L.push('  text-align: ' + align + ';');
    L.push('  transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;');
    if (s.rotate !== 0) L.push('  transform: rotate(' + s.rotate + 'deg);');
    L = L.concat(extra);
    L.push('}');

    /* 眉标：反白小色块，排在标题之上 */
    L.push('');
    L.push('.brutal-card__kicker {');
    L.push('  display: inline-block;');
    L.push('  margin-bottom: 12px;');
    L.push('  padding: 4px 9px;');
    L.push('  background: ' + s.color + ';');
    L.push('  color: ' + s.bg + ';');
    L.push(bw > 0 ? '  border: ' + bw + 'px solid ' + s.borderColor + ';' : '  border: none;');
    L.push('  border-radius: ' + Math.min(r, 4) + 'px;');
    L.push('  font-family: ' + FONTS[s.fontFamily] + ';');
    L.push('  font-size: ' + Math.max(9, Math.round(fs * 0.66)) + 'px;');
    L.push('  font-weight: 800;');
    L.push('  letter-spacing: 0.18em;');
    L.push('  text-transform: uppercase;');
    L.push('  line-height: 1;');
    L.push('}');
    L.push('.brutal-card__kicker:empty { display: none; }');   /* 没填眉标就整块收掉 */

    L.push('');
    L.push('.brutal-card__title {');
    L.push('  margin: 0;');
    L.push('  font-size: ' + Math.round(fs * 1.5) + 'px;');
    L.push('  font-weight: ' + s.fontWeight + ';');
    L.push('  letter-spacing: ' + s.letterSpacing + 'px;');
    if (s.uppercase) L.push('  text-transform: uppercase;');
    L.push('  line-height: 1.1;');
    if (rule) {

    L.push('');
    L.push('.brutal-card__desc {');
    L.push('  margin: 12px 0 0;');
    L.push('  font-size: ' + Math.round(fs * 0.85) + 'px;');

    L.push('  letter-spacing: 0.02em;');

    L.push('');
    L.push('.brutal-card__cta {');
    L.push('  display: inline-block;');
    L.push('  margin-top: 18px;');
    L.push('  font-family: ' + FONTS[s.fontFamily] + ';');

      L.push('  border-radius: ' + r + 'px;');

    } else {

    /* 角标：顶在右上角、骑在边框上的实心小牌（留空则不渲染） */
    L.push('');
    L.push('.brutal-card__tag {');

    L.push('  top: 0;');

    L.push('  padding: 3px 7px;');
    L.push('  background: ' + s.color + ';');
    L.push('  color: ' + s.bg + ';');
    L.push('  border: ' + Math.max(2, bw) + 'px solid ' + s.borderColor + ';');
    L.push('  border-radius: ' + tagR + 'px;');
    L.push('  font-family: ' + FONTS[s.fontFamily] + ';');
    L.push('  font-size: ' + Math.max(9, Math.round(fs * 0.6)) + 'px;');
    L.push('  font-weight: 800;');
    L.push('  letter-spacing: 0.12em;');
    L.push('  text-transform: uppercase;');
    L.push('  line-height: 1;');
    L.push('  white-space: nowrap;');
    L.push('  text-align: center;');
    L.push('}');

    /* —— 取形层 —— */
    if (clip) {
      L.push('');
      L.push('.brutal-card::before {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  top: 0; right: 0; bottom: 0; left: 0;');
      L.push('  z-index: -1;');
      L = L.concat(bgLines(s, pattern));
      L.push('  clip-path: ' + clip + ';');
      L.push('}');
    }

    /* —— 通栏硬切：顶条 + 把眉标塞进条里 —— */
    if (style === 'band') {
      L.push('');
      L.push('.brutal-card::before {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  top: 0; right: 0; left: 0;');
      L.push('  height: ' + bandH + 'px;');
      L.push('  background: ' + s.color + ';');
      L.push('  border-bottom: ' + Math.max(2, bw) + 'px solid ' + s.borderColor + ';');
      if (r > 0) {
        const ir = Math.max(0, r - bw);
        L.push('  border-radius: ' + ir + 'px ' + ir + 'px 0 0;');
      }
      L.push('}');

      L.push('');
      L.push('.brutal-card__kicker {');
      L.push('  position: absolute;');
      L.push('  top: 0; right: 0; left: 0;');
      L.push('  height: ' + bandH + 'px;');
      L.push('  display: flex;');
      L.push('  align-items: center;');
      L.push('  margin: 0;');
      L.push('  padding: 0 ' + s.padX + 'px;');
      L.push('  background: transparent;');
      L.push('  color: ' + s.bg + ';');
      L.push('  border: none;');
      L.push('  border-radius: 0;');
      L.push('  text-align: ' + align + ';');
      if (align === 'center') L.push('  justify-content: center;');
      L.push('}');

      /* 角标改骑在顶条右端，并反相上色，免得墨底叠墨块看不见 */
      L.push('');
      L.push('.brutal-card__tag {');
      L.push('  top: ' + Math.round(bandH / 2) + 'px;');
      L.push('  transform: translate(36%, -50%);');
      L.push('  background: ' + s.bg + ';');
      L.push('  color: ' + s.color + ';');
      L.push('}');
    }

    /* —— 四角夹框：8 层背景拼出四只 L 角，夹在卡片外侧 —— */
    if (style === 'bracket') {
      const g = 'linear-gradient(' + s.borderColor + ', ' + s.borderColor + ')';
      const sizeH = brL + 'px ' + brT + 'px';
      const sizeV = brT + 'px ' + brL + 'px';
      const bars = [
        g + ' 0 0 / ' + sizeH + ' no-repeat',
        g + ' 0 0 / ' + sizeV + ' no-repeat',
        g + ' 100% 0 / ' + sizeH + ' no-repeat',
        g + ' 100% 0 / ' + sizeV + ' no-repeat',
        g + ' 0 100% / ' + sizeH + ' no-repeat',
        g + ' 0 100% / ' + sizeV + ' no-repeat',
        g + ' 100% 100% / ' + sizeH + ' no-repeat',
        g + ' 100% 100% / ' + sizeV + ' no-repeat'
      ];
      L.push('');
      L.push('.brutal-card::before {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  top: -' + brOut + 'px;');
      L.push('  right: -' + brOut + 'px;');
      L.push('  bottom: -' + brOut + 'px;');
      L.push('  left: -' + brOut + 'px;');
      L.push('  z-index: 0;');
      L.push('  pointer-events: none;');
      L.push('  background:');
      L.push('    ' + bars.join(',\n    ') + ';');
      L.push('}');
    }

    /* —— 斜贴封条：左上 / 右下各一条，跨角对称贴住 —— */
    if (style === 'tape') {
      const tapeW = 120, tapeH = 20;
      L.push('');
      L.push('.brutal-card::before {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  top: 0;');
      L.push('  left: 0;');
      L.push('  width: ' + tapeW + 'px;');
      L.push('  height: ' + tapeH + 'px;');
      L.push('  background: ' + s.borderColor + ';');
      L.push('  transform: translate(-50%, -50%) rotate(-45deg);');
      L.push('  z-index: 0;');
      L.push('  pointer-events: none;');
      L.push('}');
      L.push('');
      L.push('.brutal-card::after {');
      L.push("  content: '';");
      L.push('  position: absolute;');
      L.push('  bottom: 0;');
      L.push('  right: 0;');
      L.push('  width: ' + tapeW + 'px;');
      L.push('  height: ' + tapeH + 'px;');
      L.push('  background: ' + s.borderColor + ';');
      L.push('  transform: translate(50%, 50%) rotate(-45deg);');
      L.push('  z-index: 0;');
      L.push('  pointer-events: none;');
      L.push('}');
    }

    /* —— 悬停 —— */
    if (needHover) {
      L.push('');
      L.push('.brutal-card:hover {');
      const parts = [];
      if (s.hoverStraighten && s.rotate !== 0) {
        parts.push('rotate(0deg)');
      } else if (s.rotate !== 0) {
        parts.push('rotate(' + s.rotate + 'deg)');
      }
      if (s.hoverLift) parts.push('translateY(-4px)');
      if (parts.length) L.push('  transform: ' + parts.join(' ') + ';');

      if (viaFilter) {
        /* 取形款只能靠 filter 换影，加 box-shadow 会露出方块影子 */
        if (base) L.push('  filter: drop-shadow(' + hShadow + ');');
      } else if (!flat) {
        const hoverSh = [];
        if (hShadow && hShadow !== 'none') hoverSh.push(hShadow);
        const all = hoverSh.concat(deco);
        if (all.length) L.push('  box-shadow: ' + all.join(', ') + ';');
      }
      L.push('}');
    }

    return L;
  }

  /* ---------- CHECKBOX ---------- */
  /* ---------- CHECKBOX ----------
     骨架：28px 方块 + ::after 对勾
     变体：cbStyle（brutal / offset / invert / hatch / stamp）
     位移用独立的 translate 属性，避免与 transform 的旋转缩放打架 */
  /* ---------- 复选框勾选图案 ----------
     返回 { w, h, decls, rot, dx, dy }；全部用 currentColor 上色，
     因此两态（关闭/开启）只要切换 color 即可，尺寸单位为 em（随字号缩放）。 */
  function markLines(mark, radius) {
    const m = { w: '1', h: '1', decls: [], rot: 0, dx: '', dy: '' };
    mark = CB_MARKS[mark] ? mark : 'check';      /* 未知图案一律退回对勾 */

    if (mark === 'cross') {
      m.w = '.58'; m.h = '.58';
      m.decls.push('  background-image:');
      m.decls.push('    linear-gradient(45deg, transparent calc(50% - .07em), currentColor calc(50% - .07em) calc(50% + .07em), transparent calc(50% + .07em)),');
      m.decls.push('    linear-gradient(-45deg, transparent calc(50% - .07em), currentColor calc(50% - .07em) calc(50% + .07em), transparent calc(50% + .07em));');

    } else if (mark === 'dash') {
      m.w = '.94'; m.h = '.24';
      m.decls.push('  background: currentColor;');

    } else if (mark === 'block') {
      m.w = '.62'; m.h = '.62';
      m.decls.push('  background: currentColor;');

    } else if (mark === 'bars') {
      m.w = '.78'; m.h = '.56';
      m.decls.push('  background-image:');
      m.decls.push('    linear-gradient(0deg, currentColor 0 .18em, transparent .18em),');
      m.decls.push('    linear-gradient(0deg, transparent calc(100% - .18em), currentColor calc(100% - .18em));');

    } else if (mark === 'plus') {
      m.w = '.74'; m.h = '.74';
      m.decls.push('  background-image:');
      m.decls.push('    linear-gradient(0deg, transparent calc(50% - .1em), currentColor calc(50% - .1em) calc(50% + .1em), transparent calc(50% + .1em)),');
      m.decls.push('    linear-gradient(90deg, transparent calc(50% - .1em), currentColor calc(50% - .1em) calc(50% + .1em), transparent calc(50% + .1em));');

    } else if (mark === 'slash') {
      m.w = '.8'; m.h = '.8';
      m.decls.push('  background-image: linear-gradient(45deg, transparent calc(50% - .11em), currentColor calc(50% - .11em) calc(50% + .11em), transparent calc(50% + .11em));');

    } else if (mark === 'ring') {
      m.w = '.64'; m.h = '.64';
      m.decls.push('  border: .17em solid currentColor;');
      m.decls.push('  border-radius: ' + (radius > 0 ? '50%' : '0') + ';');

    } else if (mark === 'bolt') {
      m.w = '.5'; m.h = '.78';
      m.decls.push('  background: currentColor;');
      m.decls.push('  clip-path: polygon(62% 0, 16% 54%, 44% 54%, 30% 100%, 84% 42%, 54% 42%);');

    } else if (mark === 'notch') {
      m.w = '.84'; m.h = '.84';
      m.decls.push('  background: currentColor;');
      m.decls.push('  clip-path: polygon(0 0, 100% 0, 0 100%);');

    } else {
      /* check 对勾：右侧 + 底部两道硬边组成，旋转 45° */
      m.w = '.48'; m.h = '.88';
      m.rot = 45;
      m.dx = '-.03'; m.dy = '-.17';
      m.decls.push('  border: solid currentColor;');
      m.decls.push('  border-width: 0 .2em .2em 0;');
    }
    return m;
  }

  function cssCheckbox(s) {
    const style   = CB_STYLES[s.cbStyle] ? s.cbStyle : 'brutal';
    const pattern = getPattern(s);
    const bw      = Math.max(0, s.borderWidth);
    const hs      = hasShadow(s);
    const hardShadow = shadowStr(s.shadowX, s.shadowY, s.shadowBlur, s.shadowColor);
    const liftShadow = shadowStr(
      Math.max(0, s.shadowX - 2),
      Math.max(0, s.shadowY - 2),
      s.shadowBlur,
      s.shadowColor
    );
    const ease = 'cubic-bezier(.34, 1.56, .64, 1)';

    /* ---- 两态骨架：K 关闭 / O 开启 ---- */
    const K = { rotate: 0, scale: 1, dashed: false, img: null };
    const O = { rotate: 0, scale: 1, dashed: false, img: null };

    if (style === 'offset') {
      /* 背后垫一块错位的实心方块（外阴影画的，天然压在方块之下），勾选时归位被盖住 */
      K.bg = '#ffffff'; K.border = bw; K.tick = s.color;
      K.shadow = '7px 6px 0 0 ' + s.borderColor;
      O.bg = s.bg;      O.border = bw; O.tick = s.color;
      O.shadow = '0 0 0 0 ' + s.borderColor;

    } else if (style === 'invert') {
      /* 勾选直接把方块填成墨色，对勾透出底色 */
      K.bg = '#ffffff'; K.border = bw; K.shadow = hs ? hardShadow : null; K.tick = s.color;
      O.bg = s.color;   O.border = bw; O.shadow = hs ? hardShadow : null; O.tick = s.bg;
      O.rotate = -2;

    } else if (style === 'hatch') {
      /* 勾选后填上警戒斜纹 */
      const ink = hexToRgba(s.color, 0.55);
      K.bg = '#ffffff'; K.border = bw; K.shadow = hs ? hardShadow : null; K.tick = s.color;
      O.bg = s.bg;      O.border = bw; O.shadow = hs ? hardShadow : null; O.tick = s.color;
      O.img = 'repeating-linear-gradient(45deg, transparent 0 4px, ' + ink + ' 4px 8px)';

    } else if (style === 'stamp') {
      /* 未选是虚线的空框，选中像啪一下盖了个章 */
      K.bg = '#ffffff'; K.border = Math.max(1, Math.round(bw / 2)); K.shadow = null;
      K.tick = s.color; K.dashed = true;
      O.bg = s.color;   O.border = bw;
      O.shadow = hs ? hardShadow : '4px 4px 0 ' + s.borderColor;
      O.tick = s.bg; O.rotate = -8; O.scale = 1.12;

    } else {
      /* brutal：粗野硬块 */
      K.bg = '#ffffff'; K.border = bw; K.shadow = hs ? hardShadow : null; K.tick = s.color;
      O.bg = s.bg;      O.border = bw; O.shadow = hs ? hardShadow : null; O.tick = s.color;
    }

    /* 纹理与变体底图叠成多层背景 */
    function compose(img) {
      const p = [], z = [];
      if (pattern) { p.push(pattern.image); z.push(pattern.size); }
      if (img)     { p.push(img);           z.push('auto'); }
      return { img: p.length ? p.join(', ') : null, size: z.length ? z.join(', ') : null };
    }
    const kBg = compose(K.img);
    const oBg = compose(O.img);

    function bgOut(obj, extra) {
      const out = ['  background-color: ' + obj.bg + ';'];
      if (extra.img) {
        out.push('  background-image: ' + extra.img + ';');
        out.push('  background-size: ' + extra.size + ';');
      }
      return out;
    }
    function shapeOut(obj) {
      const out = [];
      out.push('  border: ' + obj.border + 'px ' + (obj.dashed ? 'dashed' : 'solid') + ' ' + s.borderColor + ';');
      out.push('  border-radius: ' + s.radius + 'px;');
      if (obj.shadow) out.push('  box-shadow: ' + obj.shadow + ';');
      out.push('  transform: rotate(' + obj.rotate + 'deg) scale(' + obj.scale + ');');
      return out;
    }

    let L = [];

    L.push('.brutal-check {');
    L.push('  display: inline-flex;');
    L.push('  align-items: center;');
    L.push('  gap: 12px;');
    L.push('  cursor: pointer;');
    L.push('  user-select: none;');
    L.push('  color: ' + s.color + ';');
    L = L.concat(fontLines(s));
    L.push('  line-height: 1;');
    L.push('}');

    L.push('');
    L.push('.brutal-check input {');
    L.push('  position: absolute;');
    L.push('  opacity: 0;');
    L.push('  pointer-events: none;');
    L.push('}');

    L.push('');
    L.push('.brutal-check__box {');
    L.push('  position: relative;');
    L.push('  flex: 0 0 auto;');
    L.push('  width: 1.9em;');      /* 用 em：拖「字号」即可整体缩放 */
    L.push('  height: 1.9em;');
    L = L.concat(bgOut(K, kBg));
    L = L.concat(shapeOut(K));
    L.push('  transition: background-color .16s ease, border-color .16s ease,');
    L.push('              box-shadow .16s ease, transform .22s ' + ease + ';');
    L.push('}');

    /* ---- 勾选图案：形状由 cbMark 决定，颜色统一走 currentColor ---- */
    const mk = markLines(s.cbMark, s.radius);
    const baseT = 'translate(-50%, -50%)' +
                  ((mk.dx || mk.dy) ? ' translate(' + mk.dx + 'em, ' + mk.dy + 'em)' : '') +
                  (mk.rot ? ' rotate(' + mk.rot + 'deg)' : '');

    L.push('');
    L.push('.brutal-check__box::after {');
    L.push("  content: '';");
    L.push('  position: absolute;');
    L.push('  left: 50%;');
    L.push('  top: 50%;');
    L.push('  width: ' + mk.w + 'em;');
    L.push('  height: ' + mk.h + 'em;');
    L = L.concat(mk.decls);
    L.push('  color: ' + K.tick + ';');
    L.push('  opacity: 0;');
    L.push('  transform: ' + baseT + ' scale(.35);');
    L.push('  transition: opacity .12s ease, transform .22s ' + ease + ', color .16s ease;');
    L.push('}');

    L.push('');
    L.push('.brutal-check input:checked + .brutal-check__box {');
    L = L.concat(bgOut(O, oBg));
    L = L.concat(shapeOut(O));
    L.push('}');

    L.push('');
    L.push('.brutal-check input:checked + .brutal-check__box::after {');
    L.push('  color: ' + O.tick + ';');
    L.push('  opacity: 1;');
    L.push('  transform: ' + baseT + ' scale(1);');
    L.push('}');

    L.push('');
    L.push('.brutal-check:hover .brutal-check__box {');
    L.push('  translate: 2px 2px;');     /* 独立属性，不影响上面的旋转缩放 */
    if (hs && style !== 'offset') L.push('  box-shadow: ' + liftShadow + ';');
    L.push('}');

    return L;
  }

  /* ---------- 开关滑块图标（纯 CSS，无需图片） ---------- */
  const ICON_SEL = '.brutal-switch__icon';

  function iconLines(icon) {

    L.push(ICON_SEL + '::before,');
    L.push(ICON_SEL + '::after {');
    L.push('  content: "";');
    L.push('  position: absolute;');
    L.push('}');

    if (icon === 'check') {
      L.push('');
      L.push(ICON_SEL + '::before {');
      L.push('  left: 50%;');
      L.push('  top: 50%;');
      L.push('  width: .3em;');
      L.push('  height: .56em;');
      L.push('  border-right: .13em solid currentColor;');
      L.push('  border-bottom: .13em solid currentColor;');
      L.push('  transform: translate(-50%, -58%) rotate(45deg);');
      L.push('}');

    } else if (icon === 'cross') {
      L.push('');
      L.push(ICON_SEL + '::before {');
      L.push('  left: 50%;');
      L.push('  top: 50%;');
      L.push('  width: .56em;');
      L.push('  height: .56em;');
      L.push('  background-image:');
      L.push('    linear-gradient(45deg, transparent calc(50% - .065em), currentColor calc(50% - .065em) calc(50% + .065em), transparent calc(50% + .065em)),');
      L.push('    linear-gradient(-45deg, transparent calc(50% - .065em), currentColor calc(50% - .065em) calc(50% + .065em), transparent calc(50% + .065em));');
      L.push('  transform: translate(-50%, -50%);');
      L.push('}');

    } else if (icon === 'moon') {
      L.push('');
      L.push(ICON_SEL + '::before {');
      L.push('  left: 50%;');
      L.push('  top: 50%;');
      L.push('  width: .66em;');
      L.push('  height: .66em;');
      L.push('  border-radius: 50%;');
      L.push('  background: currentColor;');
      L.push('  box-shadow: inset -.27em .16em 0 .02em var(--thumb-bg, #fff);');
      L.push('  transform: translate(-50%, -50%);');
      L.push('}');

    } else if (icon === 'bolt') {
      L.push('');
      L.push(ICON_SEL + '::before {');
      L.push('  left: 50%;');
      L.push('  top: 50%;');
      L.push('  width: .42em;');
      L.push('  height: .68em;');
      L.push('  background: currentColor;');
      L.push('  clip-path: polygon(60% 0, 20% 54%, 44% 54%, 34% 100%, 78% 42%, 52% 42%);');
      L.push('  transform: translate(-50%, -50%);');
      L.push('}');

    } else if (icon === 'power') {
      L.push('');
      L.push(ICON_SEL + '::before {');
      L.push('  left: 50%;');
      L.push('  top: 50%;');
      L.push('  width: .48em;');
      L.push('  height: .48em;');
      L.push('  border: .11em solid currentColor;');
      L.push('  border-top-color: transparent;');
      L.push('  border-radius: 50%;');
      L.push('  transform: translate(-50%, -50%);');
      L.push('}');
      L.push('');
      L.push(ICON_SEL + '::after {');
      L.push('  left: 50%;');
      L.push('  top: 50%;');
      L.push('  width: .11em;');
      L.push('  height: .3em;');
      L.push('  background: currentColor;');
      L.push('  transform: translate(-50%, -128%);');
      L.push('}');

    return L;
