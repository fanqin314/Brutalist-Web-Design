  /* ---------------- 统一入口 ---------------- */
  /* ---------------- 状态别名 ----------------
     把 :hover / :active / :focus(-visible|-within) 额外挂一个类名别名，
     好让「五态矩阵」在不真的悬停鼠标的情况下把状态摆出来；
     顺带也让使用者能用 JS 手动切状态（比如 .is-hover 做「加载中」）。 */
  function stateAliases(L) {
    const MAP = [
      { re: /:hover/g,           cls: '.is-hover'  },
      { re: /:active/g,          cls: '.is-active' },
      { re: /:focus-visible/g,   cls: '.is-focus'  },
      { re: /:focus-within/g,    cls: '.is-focus'  },
      { re: /:focus(?![-a-z])/g, cls: '.is-focus'  }
    ];
    const out = [];
    for (let i = 0; i < L.length; i++) {
      const line = L[i];
      const t = line.trim();
      if (!t || t.charAt(0) === '@' || t.charAt(t.length - 1) !== '{') { out.push(line); continue; }
      const parts = t.slice(0, -1).trim().split(',')
        .map(function (x) { return x.trim(); }).filter(Boolean);
      const add = [];
      parts.forEach(function (pt) {
        MAP.forEach(function (m) {
          m.re.lastIndex = 0;
          let mm = null, last = null;
          while ((mm = m.re.exec(pt)) !== null) last = mm;
          if (!last) return;
          const alias = pt.slice(0, last.index) + m.cls + pt.slice(last.index + last[0].length);
          if (parts.indexOf(alias) < 0 && add.indexOf(alias) < 0) add.push(alias);
        });
      });
      if (!add.length) { out.push(line); continue; }
      out.push(parts.concat(add).join(', ') + ' {');
    }
    return out;
  }

  /* ---------------- 通用状态块 ----------------
     禁用 / 键盘焦点 / 降低动效 —— 这三个状态原来是全空的：
     生成的组件没有禁用态，Tab 键走过去看不见焦点，也没照顾 prefers-reduced-motion。 */
  function universalStates(s) {
    const root = ROOT_SEL[s.mode] || '.brutal-btn';
    const L = [];

    L.push('');
    L.push('/* 禁用态：原生 :disabled / aria-disabled / 手动 .is-disabled 任选其一 */');
    L.push(root + ':disabled,');
    L.push(root + '[aria-disabled="true"],');
    L.push(root + '.is-disabled,');
    L.push(root + ':has(input:disabled),');
    L.push(root + ':has([aria-disabled="true"]) {');
    L.push('  opacity: .35;');
    L.push('  filter: grayscale(1);');
    L.push('  box-shadow: none;');
    L.push('  transform: none;');
    L.push('  cursor: not-allowed;');
    L.push('  pointer-events: none;');
    L.push('}');

    L.push('');
    L.push('/* 键盘焦点：仅键盘 Tab 过来时显示，鼠标点击不显示 */');
    L.push(root + ':focus-visible,');
    L.push(root + ':has(input:focus-visible),');
    L.push(root + '.is-focus {');
    L.push('  outline: 3px solid ' + s.color + ';');
    L.push('  outline-offset: 3px;');
    L.push('}');

    L.push('');
    L.push('/* 降低动效：系统开启「减少动态效果」时，过渡与动画几乎瞬时完成 */');
    L.push('@media (prefers-reduced-motion: reduce) {');
    L.push('  ' + root + ',');
    L.push('  ' + root + '::before,');
    L.push('  ' + root + '::after {');
    L.push('    transition-duration: .01ms !important;');
    L.push('    animation-duration: .01ms !important;');
    L.push('    animation-iteration-count: 1 !important;');
    L.push('  }');
    L.push('}');

    return L;
  }

  function buildCSS(s) {
    let L;
    switch (s.mode) {
      case 'card':     L = cssCard(s);     break;
      case 'checkbox': L = cssCheckbox(s); break;
      case 'switch':   L = cssSwitch(s);   break;
      case 'input':    L = cssInput(s);    break;
      case 'badge':    L = cssBadge(s);    break;
      case 'radio':    L = cssRadio(s);    break;
      case 'progress': L = cssProgress(s); break;
      case 'slider':   L = cssSlider(s);   break;
      case 'select':   L = cssSelect(s);   break;
      default:         L = cssButton(s);   break;
    }
    L = stateAliases(L);
    return L.concat(universalStates(s)).join('\n');
  }

  /* =========================================================
     HTML 生成 · 各模式
     ========================================================= */

  function buildHTML(s) {
    switch (s.mode) {

      case 'card': {
        const kicker = (s.kicker || '').trim();
        const tag    = (s.cardTag || '').trim();
        let h = '<div class="brutal-card">\n';
        if (tag) h += '  <span class="brutal-card__tag">' + esc(tag) + '</span>\n';
        /* 眉标恒定输出（空则不占位），band 变体要靠它把文字塞进顶条 */
        h += '  <span class="brutal-card__kicker">' + (kicker ? esc(kicker) : '') + '</span>\n';
        h += '  <h3 class="brutal-card__title">' + esc(s.text || '标题') + '</h3>\n';
        h += '  <p class="brutal-card__desc">' + esc(s.sub || '描述文字') + '</p>\n';
        h += '  <a class="brutal-card__cta" href="#">了解更多</a>\n';
        h += '</div>';
        return h;
      }

      case 'checkbox':
        return '<label class="brutal-check">\n' +
               '  <input type="checkbox" checked>\n' +
               '  <span class="brutal-check__box"></span>\n' +
               '  <span class="brutal-check__label">' + esc(s.text || '选项') + '</span>\n' +
               '</label>';

      case 'switch':
        return '<label class="brutal-switch">\n' +
               '  <input type="checkbox" checked>\n' +
               '  <span class="brutal-switch__track">\n' +
               '    <span class="brutal-switch__thumb">\n' +
               '      <span class="brutal-switch__icon"></span>\n' +
               '    </span>\n' +
               '  </span>\n' +
               '  <span class="brutal-switch__label">' + esc(s.text || '开关') + '</span>\n' +
               '</label>';

      case 'input': {
        /* 结构恒定：壳 + [标签牌] + [标记] + input + [单位]，
           标记与单位由 CSS 绘制（伪元素挂不到 <input> 上，所以它们必须是壳的子元素） */
        const hasMark = !!(IN_MARKS[s.inMark] && s.inMark !== 'none');
        const unitTxt = (s.inUnit || '').trim();
        const tagTxt  = (s.inTag  || '').trim() || 'NAME';
        let h = '<label class="brutal-field">\n';
        if (s.inStyle === 'label') h += '  <span class="brutal-field__tag">' + esc(tagTxt) + '</span>\n';
        if (hasMark) h += '  <span class="brutal-field__mark"></span>\n';
        h += '  <input class="brutal-input" type="text" placeholder="' + esc(s.text || '请输入...') + '">\n';
        if (unitTxt) h += '  <span class="brutal-field__unit">' + esc(unitTxt) + '</span>\n';
        h += '</label>';
        return h;
      }

      case 'badge':
        return '<span class="brutal-badge">' + esc(s.text || 'NEW') + '</span>';

      case 'radio': {
        /* 三个选项，第二个选中；name 统一给 plan，矩阵里会按份加下标 */
        const opts = [s.text || '选项一', '选项二', '选项三'];
        let h = '<div class="brutal-radio">\n';
        opts.forEach(function (t, i) {
          h += '  <label class="brutal-radio__opt">\n';
          h += '    <input class="brutal-radio__input" type="radio" name="plan"' +
               (i === 1 ? ' checked' : '') + '>\n';
          h += '    <span class="brutal-radio__mark"></span>\n';
          h += '    <span class="brutal-radio__text">' + esc(t) + '</span>\n';
          h += '  </label>\n';
        });
        h += '</div>';
        return h;
      }

      case 'progress': {
        const label = (s.text || '').trim();
        let h = '<div class="brutal-progress">\n';
        h += '  <div class="brutal-progress__head">\n';
        h += '    <span class="brutal-progress__label">' + (label ? esc(label) : '') + '</span>\n';
        if (s.pgShowVal !== false) {
          h += '    <span class="brutal-progress__val">' +
               Math.round(Math.max(0, Math.min(100, Number(s.pgValue) || 0))) + '%</span>\n';
        }
        h += '  </div>\n';
        h += '  <div class="brutal-progress__track">\n';
        h += '    <div class="brutal-progress__fill"></div>\n';
        h += '  </div>\n';
        h += '</div>';
        return h;
      }

      case 'slider': {
        const label = (s.text || '').trim();
        const val   = Math.round(Math.max(0, Math.min(100, Number(s.slValue) || 0)));
        let h = '<div class="brutal-slider">\n';
        h += '  <div class="brutal-slider__head">\n';
        h += '    <span class="brutal-slider__label">' + (label ? esc(label) : '') + '</span>\n';
        if (s.slShowVal !== false) {
          h += '    <span class="brutal-slider__val">' + val + '</span>\n';
        }
        h += '  </div>\n';
        h += '  <input class="brutal-slider__input" type="range" min="0" max="100" value="' + val + '" style="--val:' + val + '%">\n';
        h += '</div>';
        return h;
      }

      case 'select': {
        const tag = (s.text || '').trim();
        const opts = String(s.seOpts || '').split(/[,，]/)
          .map(function (x) { return x.trim(); })
          .filter(Boolean).slice(0, 5);
        const selIdx = (typeof s.seSelected === 'number' && opts[s.seSelected]) ? s.seSelected : 0;
        let h = '<div class="brutal-select" role="combobox" aria-haspopup="listbox" aria-expanded="false" tabindex="0">\n';
        if (tag) h += '  <span class="brutal-select__tag">' + esc(tag) + '</span>\n';
        h += '  <span class="brutal-select__value">' + esc(opts[selIdx] || opts[0] || '') + '</span>\n';
        h += '  <span class="brutal-select__arrow"></span>\n';
        h += '  <ul class="brutal-select__list" role="listbox">\n';
        opts.forEach(function (t, i) {
          h += '    <li class="brutal-select__opt" role="option"' + (i === selIdx ? ' aria-selected="true"' : '') + '>' + esc(t) + '</li>\n';
        });
        h += '  </ul>\n';
        h += '</div>';
        return h;
      }

      default: {
        const hasIcon = !!(BTN_ICONS[s.btnIcon] && s.btnIcon !== 'none');
        let h = '<button class="brutal-btn" type="button"' +
                (s.badge ? ' data-badge="' + esc(s.badge) + '"' : '') + '>\n';
        if (hasIcon) h += '  <span class="brutal-btn__icon"></span>\n';
        h += '  <span class="brutal-btn__label">' + esc(s.text || '按钮') + '</span>\n';
        h += '</button>';
        return h;
      }
    }
  }

  /* ---------------- 状态矩阵 ----------------
     给一份组件 HTML 的根元素（以及内部的 input）挂上状态类，
     好让 stateAliases() 派生出来的 .is-* 规则命中 */
  function withState(html, cls, idx) {
    let h = html;
    /* 单选组要靠 name 成组；五态矩阵会在同一页里摆 5 份同样的组件，
       同名就变成一个 15 个选项的大组，只有最后一份的 checked 生效 ——
       所以进矩阵时给每份的 name 加个下标，各自成组。 */
    if (idx !== undefined && idx !== null) {
      h = h.replace(/\bname="([^"]*)"/g, function (m, n) {
        return 'name="' + n + '-' + idx + '"';
      });
    }
    if (!cls) return h;
    /* 给根元素挂状态类（矩阵靠它命中派生出来的 .is-* 规则） */
    h = h.replace(/class="([^"]*)"/, function (m, c) {
      return 'class="' + c + ' ' + cls + '"';
    });
    h = h.replace(/<input\b([^>]*)>/, function (m, a) {
      return /\bclass="/.test(a) ? m : '<input' + a + ' class="' + cls + '">';
    });
    return h;
  }

  /* 矩阵只摆「这个组件真的有」的状态：
     badge / switch 这类没有 :hover 规则的组件，硬塞一个"悬停"格子只会让人困惑。
     判据就是生成的 CSS 里到底有没有这条别名规则 —— 不猜，直接查。 */
  function matrixStates(css) {
    return MX_STATES.filter(function (st) {
      return !st.cls || css.indexOf(st.cls) >= 0;
    });
  }

  function matrixHTML(s, one, css) {
    const states = matrixStates(css);
    let h = '<div class="mx-grid mx-grid--' + s.mode + '" data-states="' + states.length + '">\n';
    states.forEach(function (st, i) {
      h += '  <div class="mx-cell">\n';
      h += '    <div class="mx-stage">' + withState(one, st.cls, i) + '</div>\n';
      h += '    <span class="mx-label">' + st.label + '</span>\n';
      h += '  </div>\n';
    });
    h += '</div>';
    return h;
  }

  /* =========================================================
     同步 UI
     ========================================================= */

  function syncUI() {
    document.querySelectorAll('[data-key]').forEach(function (el) {
      if (document.activeElement === el) return;
      const key = el.dataset.key;
      const v = state[key];
      if (el.type === 'checkbox') {
        el.checked = !!v;
      } else if (el.value !== String(v)) {
        el.value = v;
      }
    });

    document.querySelectorAll('[data-out]').forEach(function (el) {
      const key = el.dataset.out;
      let v = state[key];
      if (typeof v === 'number' && !Number.isInteger(v)) v = v.toFixed(1);
      el.textContent = v;
    });
  }

  /* =========================================================
     可见性
     ========================================================= */

  function updateVisibility() {
    document.querySelectorAll('[data-modes]').forEach(function (el) {
      const modes = el.dataset.modes.split(/\s+/);
      el.style.display = modes.indexOf(state.mode) !== -1 ? '' : 'none';
    });
  }

  /* =========================================================
     渲染
     ========================================================= */

  /* ---------------- 预览区左上角的纹理标签 ----------------
     注意：必须放在 preview.innerHTML = html 之后重建，
     否则静态写在 HTML 里的 #patternTag 会被整块覆盖掉 */
  function renderPatternTag() {
    const old = document.getElementById('patternTag');
    if (old) old.remove();

    const tag = document.createElement('div');
    tag.className = 'pattern-tag';
    tag.id = 'patternTag';

    const sw = document.createElement('span');
    sw.className = 'pattern-tag__sw';
    sw.style.backgroundColor = state.bg;
    const p = getPattern(state, 0.45);   /* 缩略图用更深的墨色才看得清 */
    if (p) {
      sw.style.backgroundImage = p.image;
      sw.style.backgroundSize  = p.size;
    }

    const txt = document.createElement('span');
    txt.textContent = PATTERN_LABELS[state.pattern] || state.pattern;

    tag.appendChild(sw);
    tag.appendChild(txt);
    preview.appendChild(tag);
  }

  function render() {
    const one = buildHTML(state);
    const css = buildCSS(state);

    /* 预览区：五态矩阵 或 单个组件；导出的永远是单个组件。
       统一套一层 .pv-canvas，设备宽度模拟才有东西可以夹住。 */
    const inner = state.showMatrix ? matrixHTML(state, one, css) : one;
    preview.innerHTML = '<div class="pv-canvas">' + inner + '</div>';
    applyView();
    renderPatternTag();
    genStyle.textContent = css;

    /* 代码区可能被压缩 / 高亮，但复制与导出永远拿 dataset.raw 这份原文 */
    setCode(htmlCode, view.minify ? minifyHTML(one) : one, 'html');
    setCode(cssCode,  view.minify ? minifyCSS(css)  : css,  'css');

    textLabel.textContent = TEXT_LABELS[state.mode] || '文字';
    updateVisibility();
    syncUI();
    saveStateSoon();
  }

  /* =========================================================
     事件 · 控件
     ========================================================= */

  document.querySelectorAll('[data-key]').forEach(function (el) {
    const key = el.dataset.key;

    el.addEventListener('input', function () {
      let v;
      if (el.type === 'checkbox')      v = el.checked;
      else if (el.type === 'range')    v = parseFloat(el.value);
      else                             v = el.value;

      state[key] = v;
      render();
      scheduleHistory();
    });
  });

  /* =========================================================
     事件 · 模式切换
     ========================================================= */

  document.querySelectorAll('.mode-tab').forEach(function (tab) {
    tab.addEventListener('click', function () { setMode(tab.dataset.mode); });
  });

  /* 标签栏键盘导航：方向键在组内移动并即时切换，Home / End 跳首尾。 */
  (function bindModeKeys() {
    const bar = document.querySelector('.modebar');
    if (!bar) return;
    bar.addEventListener('keydown', function (e) {
      const tabs = Array.prototype.slice.call(bar.querySelectorAll('.mode-tab'));
      const i = tabs.indexOf(document.activeElement);
      if (i < 0) return;

      let n = -1;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown')   n = (i + 1) % tabs.length;
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') n = (i - 1 + tabs.length) % tabs.length;
      else if (e.key === 'Home')                             n = 0;
      else if (e.key === 'End')                              n = tabs.length - 1;
      else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        setMode(tabs[i].dataset.mode);
        return;
      } else return;

      e.preventDefault();
      tabs[n].focus();
      setMode(tabs[n].dataset.mode);
    });
  })();

  /* 数字键 1~9 / 0 直跳模式。面板里有几十个输入控件 ——
     在输入框、下拉里按数字是在打字，绝不能抢。 */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' ||
              t.tagName === 'SELECT' || t.isContentEditable)) return;
    if (!/^[0-9]$/.test(e.key)) return;
    const mode = MODES[e.key === '0' ? 9 : Number(e.key) - 1];
    if (!mode) return;
    e.preventDefault();
    setMode(mode);
  });

  /* =========================================================
     随机 / 重置
     ========================================================= */

  const PALETTES = [
    { bg:'#ffe94a', color:'#0a0a0a', borderColor:'#0a0a0a', shadowColor:'#0a0a0a' },
    { bg:'#8ed500', color:'#141414', borderColor:'#141414', shadowColor:'#141414' },
    { bg:'#ffffff', color:'#0a0a0a', borderColor:'#0a0a0a', shadowColor:'#0a0a0a' },
    { bg:'#0a0a0a', color:'#8ed500', borderColor:'#8ed500', shadowColor:'#8ed500' },
    { bg:'#ff5c39', color:'#0a0a0a', borderColor:'#0a0a0a', shadowColor:'#0a0a0a' },
    { bg:'#00e0ff', color:'#0a0a0a', borderColor:'#0a0a0a', shadowColor:'#ff5c39' },
    { bg:'#ffb6e1', color:'#0a0a0a', borderColor:'#0a0a0a', shadowColor:'#0a0a0a' },
    { bg:'#4d5bff', color:'#ffffff', borderColor:'#0a0a0a', shadowColor:'#0a0a0a' },
    { bg:'#f5f0e6', color:'#0a0a0a', borderColor:'#ff5c39', shadowColor:'#0a0a0a' },
    { bg:'#141414', color:'#f3f3f3', borderColor:'#f3f3f3', shadowColor:'#8ed500' }
  ];

  function randomize() {
    const p = pick(PALETTES);
    state.bg          = p.bg;
    state.color       = p.color;
    state.borderColor = p.borderColor;
    state.shadowColor = p.shadowColor;

    state.borderWidth = pick([2, 3, 4, 5, 6, 8]);
    state.radius      = pick([0, 0, 0, 0, 8, 16]);
    state.rotate      = pick([0, 0, -2, -3, 2, 3, -1]);
    state.shadowX     = pick([0, 4, 6, 8, 10, 12, 15]);
    state.shadowY     = pick([0, 4, 6, 8, 10, 12, 15]);
    state.shadowBlur  = pick([0, 0, 0, 10, 20]);
    state.padX        = pick([18, 24, 30, 34, 42]);
    state.padY        = pick([10, 14, 16, 20]);
    state.fontSize    = pick([14, 15, 16, 18, 20]);
    state.fontWeight  = pick(['700', '800', '900', '900']);
    state.fontFamily  = pick(['mono', 'mono', 'impact', 'arialblack', 'sans']);
    state.letterSpacing = pick([0, 1, 1.5, 2, 3]);
    state.uppercase   = Math.random() < 0.8;
    state.pattern     = pick(['none', 'none', 'none', 'stripes', 'grid', 'dots']);

    state.hoverStraighten = state.rotate !== 0;
    state.hoverGrowShadow = Math.random() < 0.6;
    state.hoverLift       = Math.random() < 0.35;
    state.hoverInvert     = Math.random() < 0.3;
    state.pressShake      = Math.random() < 0.3;

    if (state.mode === 'button') {
      state.badge = Math.random() < 0.35 ? pick(['NEW', 'HOT', 'V2', '!', '99']) : '';
      state.btnStyle = pick(['solid', 'solid', 'outline', 'double', 'skew',
                             'corner', 'rail', 'bracket', 'push']);
      state.btnIcon  = pick(['none', 'none', 'none', 'arrow', 'plus',
                             'check', 'bolt', 'star', 'chevron', 'dot']);
      state.btnIconPos = pick(['right', 'right', 'left']);
    }

    if (state.mode === 'switch') {
      state.swStyle  = pick(['brutal', 'offset', 'stripe', 'skew',
                             'slab', 'double', 'split', 'tape', 'flip']);
      state.knobIcon = pick(['none', 'none', 'check', 'cross', 'bolt', 'moon', 'power']);
      state.motion   = pick(['step', 'step', 'linear', 'smooth', 'spring', 'bounce']);
      state.swScale  = pick([0.9, 1, 1, 1.2, 1.4]);
      state.glow     = pick([0, 0, 6, 10, 14]);
    }

    if (state.mode === 'checkbox') {
      state.cbStyle = pick(['brutal', 'offset', 'invert', 'hatch', 'stamp']);
      state.cbMark  = pick(['check', 'check', 'cross', 'dash', 'block',
                            'bars', 'plus', 'slash', 'ring', 'bolt', 'notch']);
    }

    if (state.mode === 'input') {
      state.inStyle = pick(['brutal', 'brutal', 'double', 'under', 'label', 'term',
                            'bracket', 'bevel', 'band', 'rail', 'stamp', 'stripe']);
      state.inMark  = pick(['none', 'none', 'caret', 'prompt', 'at', 'hash',
                            'star', 'arrow', 'block', 'dot']);
      state.inFocus = pick(['press', 'press', 'invert', 'none']);
      state.inUnit  = Math.random() < 0.28 ? pick(['.com', 'kg', 'cm', 'A1', '%', 'psi']) : '';
      state.inTag   = pick(['NAME', 'EMAIL', 'USER', 'ID', 'KEY', 'NO.']);
      state.inW     = pick([240, 280, 320, 360, 400, 440]);
      state.padX    = pick([12, 16, 20, 24, 30]);
      state.padY    = pick([10, 12, 14, 16]);
      state.fontSize = pick([14, 15, 16, 17, 18]);
      state.uppercase = Math.random() < 0.25;
    }
    if (state.mode === 'badge') {
      state.bdStyle = pick(['slab', 'ticket', 'banner', 'zigzag', 'fold', 'stamp', 'outline', 'side']);
      state.bdMark  = pick(['none', 'none', 'square', 'circle', 'star', 'bolt', 'arrow', 'bar']);
      state.bdPadX  = pick([9, 11, 13, 16, 20]);
      state.bdPadY  = pick([3, 5, 6, 8, 10]);
      state.fontSize = pick([13, 15, 16, 18, 20]);
    }

    if (state.mode === 'radio') {
      state.rdStyle = pick(['box', 'box', 'dot', 'dash', 'invert', 'skew', 'stamp']);
      state.rdSize  = pick([16, 20, 22, 26, 30]);
      state.rdGap   = pick([6, 8, 10, 12, 16]);
      state.rdW     = pick([220, 260, 300, 340]);
      state.fontSize = pick([14, 15, 16, 18]);
      state.uppercase = Math.random() < 0.2;
    }

    if (state.mode === 'progress') {
      state.pgStyle = pick(['slab', 'slab', 'stripe', 'segment', 'notch', 'double', 'tick']);
      state.pgValue = pick([18, 35, 50, 64, 78, 92]);
      state.pgW     = pick([260, 300, 340, 400, 460]);
      state.pgH     = pick([14, 20, 26, 32, 40]);
      state.pgShowVal = Math.random() < 0.75;
      state.fontSize = pick([13, 14, 15, 16]);
      state.uppercase = Math.random() < 0.5;
    }

    if (state.mode === 'slider') {
      state.slStyle = pick(['slab', 'slab', 'double', 'tick', 'skew', 'hatch', 'invert']);
      state.slValue = pick([12, 30, 45, 60, 75, 88]);
      state.slW     = pick([260, 300, 340, 400, 460]);
      state.slH     = pick([16, 20, 24, 30, 38]);
      state.slShowVal = Math.random() < 0.75;
      state.fontSize = pick([13, 14, 15, 16]);
      state.uppercase = Math.random() < 0.5;
    }

    if (state.mode === 'select') {
      state.seStyle = pick(['slab', 'slab', 'double', 'rail', 'bracket', 'band', 'stamp']);
      state.seW     = pick([240, 280, 320, 380, 440]);
      state.seOpts  = pick(['选项一, 选项二, 选项三',
                            '标准, 加急, 特急',
                            '北京, 上海, 成都, 深圳',
                            '小, 中, 大, 特大',
                            'A 档, B 档, C 档']);
      state.fontSize = pick([14, 15, 16, 17, 18]);
      state.uppercase = Math.random() < 0.25;
    }

    if (state.mode === 'card') {
      state.cardStyle = pick(['slab', 'band', 'bracket', 'bevel',
                              'notch', 'stamp', 'rail', 'tape']);
      state.ctaStyle  = pick(['solid', 'solid', 'outline', 'arrow']);
      state.cardAlign = pick(['left', 'left', 'center']);
      state.cardW     = pick([260, 280, 300, 320, 340]);
      state.titleRule = Math.random() < 0.7;
      state.kicker    = Math.random() < 0.75
                        ? pick(['SPEC 04', 'BLUEPRINT', 'CUT 45°', 'TICKET',
                                'APPROVED', 'RAIL 01', 'TAPED', 'NO.7'])
                        : '';
      state.cardTag   = Math.random() < 0.4 ? pick(['A1', 'V2', 'N°7', '01', '!!']) : '';
      state.padX      = pick([24, 28, 30, 34]);
      state.padY      = pick([18, 20, 22, 26]);
      state.fontSize  = pick([15, 16, 17, 18]);
    }

    render();
    flushHistory();
  }

  function reset() {
    const mode = state.mode;
    state = Object.assign({}, DEFAULTS);
    state.mode = mode;
    render();
    flushHistory();
  }

  /* =========================================================
     事件 · 预设
     ========================================================= */

  document.querySelectorAll('[data-preset]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const preset = PRESETS[btn.dataset.preset];
      if (!preset) return;
      const mode = state.mode;
      state = sanitize(Object.assign({}, preset, { mode: mode }));
      render();
      flushHistory();
    });
  });

  /* =========================================================
     复制
     ========================================================= */

  function copyText(text, btn) {
    const done = function () {
      const old = btn.textContent;
      btn.textContent = '已复制 ✓';
      setTimeout(function () { btn.textContent = old; }, 1100);
    };

    const fallback = function (t) {
      const ta = document.createElement('textarea');
      ta.value = t;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) { /* noop */ }
      document.body.removeChild(ta);
    };

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(function () {
        fallback(text);
        done();
      });
    } else {
      fallback(text);
      done();
    }
  }

  document.querySelectorAll('.copy').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const target = document.getElementById(btn.dataset.target);
      if (!target) return;
      /* 高亮会在 <code> 里插一堆 <span>，textContent 虽然还是原文，
         但走 dataset.raw 更稳：高亮规则改了也影响不到复制结果 */
      const raw = target.dataset.raw;
      copyText(raw != null ? raw : target.textContent, btn);
    });
  });

  /* =========================================================
     T1 · 存档 / 历史 / 分享 / 导出
     ========================================================= */

  const SAVE_KEY = 'brutalist-gen-v3';
  const HIST_MAX = 60;
  const MODES = ['button', 'card', 'checkbox', 'switch', 'input', 'badge',
                 'radio', 'progress', 'slider', 'select'];

  /* 存档与分享链接都属于「外部输入」：坏值会让 render 炸掉，或者生成出
     看着能跑、其实不是粗野主义的东西。所有外部来的状态一律先过这张白名单。 */
  const ENUMS = {
    mode:       MODES,
    pattern:    Object.keys(PATTERN_LABELS),
    fontFamily: Object.keys(FONTS),
    fontWeight: ['400', '500', '600', '700', '800', '900'],
    motion:     Object.keys(MOTION),
    btnStyle:   Object.keys(BTN_STYLES),
    btnIcon:    Object.keys(BTN_ICONS),
    btnIconPos: ['left', 'right'],
    cardStyle:  Object.keys(CARD_STYLES),
    cardAlign:  ['left', 'center'],
    ctaStyle:   Object.keys(CTA_STYLES),
    cbStyle:    Object.keys(CB_STYLES),
    cbMark:     Object.keys(CB_MARKS),
    swStyle:    Object.keys(SW_STYLES),
    knobIcon:   ['none', 'check', 'cross', 'bolt', 'moon', 'power'],
    inStyle:    Object.keys(IN_STYLES),
    inMark:     Object.keys(IN_MARKS),
    inFocus:    Object.keys(IN_FOCUS),
    bdStyle:    Object.keys(BD_STYLES),
    bdMark:     Object.keys(BD_MARKS),
    rdStyle:    Object.keys(RD_STYLES),
    pgStyle:    Object.keys(PG_STYLES),
    slStyle:    Object.keys(SL_STYLES),
    seStyle:    Object.keys(SE_STYLES)
  };

  function sanitize(raw) {
    const out = Object.assign({}, DEFAULTS);
    if (raw && typeof raw === 'object') {
      Object.keys(DEFAULTS).forEach(function (k) {
        if (!(k in raw)) return;
        const v = raw[k];
        const want = typeof DEFAULTS[k];
        if (want === 'number' && typeof v === 'number' && isFinite(v)) out[k] = v;
        else if (want === 'boolean' && typeof v === 'boolean') out[k] = v;
        else if (want === 'string' && typeof v === 'string') out[k] = v;
      });
    }
    Object.keys(ENUMS).forEach(function (k) {
      if (ENUMS[k].indexOf(out[k]) === -1) out[k] = DEFAULTS[k];
    });

    /* 数值区间不另建表：直接从面板上那个 range 控件读 min / max ——
       滑杆的区间就是唯一事实来源，以后改滑杆范围，这里自动跟上。
       少了这一步，一份手改过的 JSON 能塞进 fontSize:1e9，导出的 CSS 直接废掉。 */
    document.querySelectorAll('input[type="range"][data-key]').forEach(function (el) {
      const k = el.dataset.key;
      if (typeof out[k] !== 'number') return;
      const min = parseFloat(el.min);
      const max = parseFloat(el.max);
      if (isFinite(min) && out[k] < min) out[k] = min;
      if (isFinite(max) && out[k] > max) out[k] = max;
    });

    /* 文本按控件自身的 maxlength 截断，存档里塞不进超长串 */
    document.querySelectorAll('input[type="text"][data-key]').forEach(function (el) {
      const k = el.dataset.key;
      const max = parseInt(el.getAttribute('maxlength'), 10);
      if (typeof out[k] === 'string' && isFinite(max) && out[k].length > max) {
        out[k] = out[k].slice(0, max);
      }
    });

    return out;
  }

  /* ---------------- 本地存档 ---------------- */

  const savePill     = document.getElementById('savePill');
  const savePillText = document.getElementById('savePillText');
  const undoBtn      = document.getElementById('undoBtn');
  const redoBtn      = document.getElementById('redoBtn');
  const shareBtn     = document.getElementById('shareBtn');

  let saveTimer = null;

  function setSavePill(saved) {
    if (!savePill) return;
    savePill.classList.toggle('is-idle', !saved);
    savePillText.textContent = saved ? '已保存' : '保存中';
  }

  function saveState() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
    catch (e) { /* 隐私模式 / 配额满：静默降级，功能照用 */ }
    setSavePill(true);
  }

  function saveStateSoon() {
    setSavePill(false);
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { saveTimer = null; saveState(); }, 300);
  }

  function loadSaved() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      return sanitize(JSON.parse(raw));
    } catch (e) { return null; }
  }

  /* ---------------- 撤销 / 重做 ----------------
     拖滑杆、连续打字都会连续触发 input：静默 420ms 才记一条，
     否则一次拖动就塞进几十条历史，撤销按到手酸。
     离散操作（切模式 / 预设 / 随机 / 重置 / 导入）立即记。 */

  let hist = [];
  let hIdx = -1;
  let histLock = false;
  let histTimer = null;

  function syncHistBtns() {
    if (undoBtn) undoBtn.disabled = hIdx <= 0;
    if (redoBtn) redoBtn.disabled = hIdx >= hist.length - 1;
  }

  function pushHistory() {
    if (histLock) return;
    const now = JSON.stringify(state);
    if (hIdx >= 0 && hist[hIdx] === now) return;
    hist = hist.slice(0, hIdx + 1);
    hist.push(now);
    if (hist.length > HIST_MAX) hist.shift();
    hIdx = hist.length - 1;
    syncHistBtns();
  }

  function scheduleHistory() {
    if (histTimer) clearTimeout(histTimer);
    histTimer = setTimeout(function () { histTimer = null; pushHistory(); }, 420);
  }

  function flushHistory() {
    if (histTimer) { clearTimeout(histTimer); histTimer = null; }
    pushHistory();
  }

  function applyHistory(str) {
    histLock = true;
    state = sanitize(JSON.parse(str));
    syncTabs();
    render();
    histLock = false;
  }

  function undo() {
    if (hIdx <= 0) return;
    hIdx -= 1;
    applyHistory(hist[hIdx]);
    syncHistBtns();
  }

  function redo() {
    if (hIdx >= hist.length - 1) return;
    hIdx += 1;
    applyHistory(hist[hIdx]);
    syncHistBtns();
  }

  /* ---------------- modebar 增强 ----------------
     原标签栏的短板：中文排版照搬英文大写那套、没有 tab 语义、
     没有键盘导航、窄屏换行把预览挤下去、没有 tip、没有焦点样式。 */

  /* 款式数不写死在 HTML 里 —— 常量表才是唯一事实源，
     以后给某个组件加了新款式，徽标自动跟上。 */
  function modeStyleCount(mode) {
    const T = { button: BTN_STYLES, card: CARD_STYLES, checkbox: CB_STYLES,
                switch: SW_STYLES, input: IN_STYLES, badge: BD_STYLES,
                radio: RD_STYLES, progress: PG_STYLES, slider: SL_STYLES,
                select: SE_STYLES }[mode];
    return T ? Object.keys(T).length : 0;
  }

  function enhanceModebar() {
    document.querySelectorAll('.mode-tab').forEach(function (tab) {
      const mode = tab.dataset.mode;
      const name = tab.textContent.trim();
      const n = modeStyleCount(mode);
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-controls', 'preview');
      if (n) tab.setAttribute('title', name + ' · ' + n + ' 款变体');
      tab.innerHTML = '<span class="mode-tab__label">' + esc(name) + '</span>' +
                      '<span class="mode-tab__n" aria-hidden="true">' + n + '</span>';
    });
  }

  /* 切模式收成一个函数：点击、方向键、数字键三条路都走它，
     免得三处各写一遍 state.mode/syncTabs/render/flushHistory。 */
  function setMode(mode) {
    if (!mode || mode === state.mode) return;
    if (MODES.indexOf(mode) === -1) return;
    state.mode = mode;
    syncTabs();
    render();
    flushHistory();
  }

  function syncTabs() {
    let active = null;
    document.querySelectorAll('.mode-tab').forEach(function (t) {
      const on = t.dataset.mode === state.mode;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      /* roving tabindex：一组 tab 只占 Tab 键的一次停留，组内用方向键走。
         十个标签都留 tabindex=0 的话，光路过标签栏就要按十下 Tab。 */
      t.tabIndex = on ? 0 : -1;
      if (on) active = t;
    });
    /* 标签栏溢出时把当前项滚进视野 */
    if (active && active.parentElement) {
      const bar = active.parentElement;
      const br = bar.getBoundingClientRect();
      const tr = active.getBoundingClientRect();
      if (tr.left < br.left) bar.scrollLeft -= (br.left - tr.left) + 10;
      else if (tr.right > br.right) bar.scrollLeft += (tr.right - br.right) + 10;
    }
  }

  /* ---------------- 分享链接 ----------------
     状态编成 URL-safe base64 挂在 # 后面。
     TextEncoder 而不是 escape()：中文描述文字也能安全往返。 */

  function toB64(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function fromB64(s) {
    let b = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    const bin = atob(b);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function shareLink() {
    const code = toB64(JSON.stringify(state));
    const url  = location.href.split('#')[0] + '#' + code;
    try { history.replaceState(null, '', '#' + code); } catch (e) { /* file:// 下可能受限 */ }
    copyText(url, shareBtn);
    toast('分享链接已复制');
  }

  /* ---------------- 提示条 ---------------- */

  let toastTimer = null;

  function toast(msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('is-on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('is-on'); }, 1800);
  }

  /* ---------------- 导出 / 导入 ---------------- */

  function downloadFile(name, text, mime) {
    const blob = new Blob([text], { type: mime + ';charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
  }

  /* 导出的是「单个组件」而不是五态矩阵 —— 预览区那套 .mx-* 只是工具自带的外壳 */
  function exportHTML() {
    const css = view.minify ? minifyCSS(buildCSS(state)) : buildCSS(state);
    const one = view.minify ? minifyHTML(buildHTML(state)) : buildHTML(state);
    const doc =
      '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n' +
      '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>Brutalist ' + state.mode + '</title>\n' +
      '<style>\n' +
      'body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;' +
      'padding:40px;background:#f7f4ec;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}\n' +
      '</style>\n<style>\n' + css + '\n</style>\n</head>\n<body>\n' + one +       '<script>\n' + (view.minify ? (SELECT_JS + '\n' + SLIDER_JS).replace(/\n[ \t]+/g, '\n') : (SELECT_JS + '\n' + SLIDER_JS)) + '\n<\/script>\n</body>\n</html>\n';
    downloadFile('brutalist-' + state.mode + '.html', doc, 'text/html');
    toast('已导出独立 HTML');
  }

  function exportJSON() {
    downloadFile('brutalist-' + state.mode + '.json',
                 JSON.stringify(state, null, 2), 'application/json');
    toast('已导出配置');
  }

  function importJSON(file) {
    const fr = new FileReader();
    fr.onload = function () {
      try {
        state = sanitize(JSON.parse(String(fr.result)));
        syncTabs();
        render();
        flushHistory();
        toast('配置已导入');
      } catch (e) { toast('配置文件读不出来'); }
    };
    fr.readAsText(file);
  }

  /* ---------------- 绑定 ---------------- */

  if (shareBtn) shareBtn.addEventListener('click', shareLink);
  if (undoBtn)  undoBtn.addEventListener('click', undo);
  if (redoBtn)  redoBtn.addEventListener('click', redo);
  document.getElementById('exportHtmlBtn').addEventListener('click', exportHTML);
  document.getElementById('exportJsonBtn').addEventListener('click', exportJSON);
  document.getElementById('importJsonBtn').addEventListener('click', function () {
    document.getElementById('importFile').click();
  });
  /* 自定义下拉 + 滑块交互：预览区生效（事件委托只绑一次）；导出的独立 HTML 也内联同一份 */
  (function () { var sc = document.createElement('script'); sc.textContent = SELECT_JS + '\n' + SLIDER_JS; document.body.appendChild(sc); })();

  document.getElementById('importFile').addEventListener('change', function (e) {
    const f = e.target.files && e.target.files[0];
    if (f) importJSON(f);
    e.target.value = '';
  });

  /* 输入框里放行浏览器原生撤销，否则打字时按 Ctrl+Z 会变成「回退整个组件」 */
  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    const k = (e.key || '').toLowerCase();
    const t = e.target;
    const typing = !!t && (t.tagName === 'TEXTAREA' ||
      (t.tagName === 'INPUT' &&
        ['text', 'search', 'url', 'email', 'tel', 'password', 'number'].indexOf(t.type) !== -1));
    if (typing && k === 'z') return;
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(); }
  });

  /* ---------------- 启动 ----------------
     hash > 本地存档 > DEFAULTS：分享链接来的那一份优先级最高 */

  function boot() {
    let loaded = null;
    let fromHash = false;
    const hash = String(location.hash || '').replace(/^#/, '');

    if (hash) {
      try { loaded = sanitize(JSON.parse(fromB64(hash))); fromHash = true; }
      catch (e) { loaded = null; }
    }
    if (!loaded) loaded = loadSaved();

    loadView();

    if (loaded) state = loaded;
    enhanceModebar();
    syncTabs();
    syncViewChips();
    render();
    pushHistory();

    if (fromHash)    toast('已从分享链接载入');
    else if (loaded) toast('已恢复上次设置');
  }

  /* =========================================================
     T3 · 画布 / 高亮 / 压缩
     ========================================================= */

  /* view 与 state 是两套东西：
     state = 你要生成的那个组件（会进存档、分享链接、导出）
     view  = 你自己的工作台偏好（只看预览，绝不进导出）
     混在一起的话，分享一条链接会把对方的预览底色也改掉。 */
  const VIEW_KEY = 'brutalist-gen-v3-view';
  const VIEW_DEFAULTS = { previewBg: 'grid', devW: 0, codeHL: true, minify: false };
  let view = Object.assign({}, VIEW_DEFAULTS);

  const PV_BGS  = ['grid', 'light', 'dark', 'checker'];
  const PV_DEVS = [0, 390, 768, 1024];

  function loadView() {
    try {
      const raw = localStorage.getItem(VIEW_KEY);
      if (!raw) return;
      const o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return;
      if (PV_BGS.indexOf(o.previewBg) !== -1)   view.previewBg = o.previewBg;
      if (PV_DEVS.indexOf(o.devW) !== -1)       view.devW = o.devW;
      if (typeof o.codeHL === 'boolean')        view.codeHL = o.codeHL;
      if (typeof o.minify === 'boolean')        view.minify = o.minify;
    } catch (e) { /* 坏存档就用默认 */ }
  }

  function saveView() {
    try { localStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch (e) { /* noop */ }
  }

  function applyView() {
    preview.classList.remove('pv-grid', 'pv-light', 'pv-dark', 'pv-checker');
    preview.classList.add('pv-' + view.previewBg);

    if (view.devW) {
      preview.classList.add('is-dev');
      preview.style.setProperty('--dev-w', view.devW + 'px');
      preview.setAttribute('data-dev', view.devW + 'px');
    } else {
      preview.classList.remove('is-dev');
      preview.style.removeProperty('--dev-w');
      preview.removeAttribute('data-dev');
    }
  }

  function syncViewChips() {
    document.querySelectorAll('[data-pvbg]').forEach(function (b) {
      b.classList.toggle('is-on', b.dataset.pvbg === view.previewBg);
    });
    document.querySelectorAll('[data-dev]').forEach(function (b) {
      b.classList.toggle('is-on', Number(b.dataset.dev) === view.devW);
    });
    const hl = document.getElementById('vCodeHL');
    const mf = document.getElementById('vMinify');
    if (hl) hl.checked = view.codeHL;
    if (mf) mf.checked = view.minify;
  }

  /* ---------------- 语法高亮 ----------------
     不引任何 CDN：一次正则扫描 + 按位置补上「没匹配到的间隙」，
     这样输出文本与原文逐字节等长（textContent 仍等于原文）。 */

  function escTok(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* 分组：1 注释 / 2 自定义属性 / 3 @规则 / 4 十六进制色 / 5 字符串 /
           6 选择器 / 7 符号 / 8 数字 / 9 分组符号 / 10 标识符
     选择器那组必须排在标点组前面，否则 :hover 会被拆成 ":" + "hover" */
  const CSS_TOK = /(\/\*[\s\S]*?\*\/)|(--[a-zA-Z][\w-]*)|(@[a-zA-Z-]+)|(#[0-9a-fA-F]{3,8}\b)|("(?:[^"\\]|\\.)*"|'[^']*')|(::?[a-zA-Z-]+(?:\([^()]*\))?|\.[a-zA-Z_][\w-]*|&)|([\[\]*\/>~+=!])|(\d+(?:\.\d+)?(?:px|%|em|rem|ms|s|deg|fr|vh|vw|ch)?)|([,{}():;])|([a-zA-Z-]+)/g;

  function hlCSS(src) {
    let out = '';
    let last = 0;
    let m;
    CSS_TOK.lastIndex = 0;
    while ((m = CSS_TOK.exec(src)) !== null) {
      out += escTok(src.slice(last, m.index));
      const t = m[0];
      let cls;
      if (m[1])      cls = 'c-com';
      else if (m[2]) cls = 'c-var';
      else if (m[3]) cls = 'c-at';
      else if (m[4]) cls = 'c-num';
      else if (m[5]) cls = 'c-val';
      else if (m[6]) cls = 'c-sel';
      else if (m[7]) cls = 'c-pun';
      else if (m[8]) cls = 'c-num';
      else if (m[9]) cls = 'c-pun';
      else {
        /* 标识符：后面紧跟冒号就是属性名，否则是关键字值 */
        const rest = src.slice(m.index + t.length);
        cls = /^\s*:/.test(rest) ? 'c-prop' : 'c-key';
      }
      out += '<span class="' + cls + '">' + escTok(t) + '</span>';
      last = m.index + t.length;
    }
    out += escTok(src.slice(last));
    return out;
  }

  const TAG_TOK = /("[^"]*")|(\/?>)|(<)|([a-zA-Z][\w-]*)|(=)|(\s+)|(.)/g;

  function hlTag(tag) {
    if (tag.slice(0, 4) === '<!--') return '<span class="c-com">' + escTok(tag) + '</span>';
    let out = '';
    let m;
    let first = true;   /* 紧跟 < 的第一个标识符是标签名，其后的都是属性名 */
    TAG_TOK.lastIndex = 0;
    while ((m = TAG_TOK.exec(tag)) !== null) {
      const t = m[0];
      if (m[1])      out += '<span class="c-val">' + escTok(t) + '</span>';
      else if (m[2] || m[3]) { out += '<span class="c-pun">' + escTok(t) + '</span>'; first = true; }
      else if (m[4]) { out += '<span class="' + (first ? 'c-tag' : 'c-attr') + '">' + escTok(t) + '</span>'; first = false; }
      else if (m[5]) out += '<span class="c-pun">' + escTok(t) + '</span>';
      else           out += escTok(t);
    }
    return out;
  }

  function hlHTML(src) {
    let out = '';
    let last = 0;
    let m;
    const re = /<[^>]*>/g;
    while ((m = re.exec(src)) !== null) {
      out += escTok(src.slice(last, m.index));
      out += hlTag(m[0]);
      last = m.index + m[0].length;
    }
    out += escTok(src.slice(last));
    return out;
  }

  function setCode(el, text, lang) {
    el.dataset.raw = text;
    if (view.codeHL) el.innerHTML = (lang === 'css' ? hlCSS : hlHTML)(text);
    else el.textContent = text;
  }

  /* ---------------- 压缩 ----------------
     刻意只做「安全压缩」：去注释、去换行缩进、收掉分隔符周围空白。
     不做 token 级重写 —— 生成的 CSS 里有 clip-path 的 polygon(38% 0, ...)，
     那种值里面的空格是有意义的。 */

  function minifyCSS(css) {
    /* 手写压缩器。三条铁律：
       1) 只做「删空白」与「等价改写」，绝不动 token 本身；
       2) 先把所有空白统一压成单空格，再删标点旁的空白。
          直接按换行删除会把 `1fr\n2fr` 粘成 `1fr2fr` —— 那是真事故；
       3) polygon() / calc() 里坐标之间的空格有意义，只删「标点旁」的空白，
          坐标之间的空格原样保留，否则形状会塌。 */
    return String(css)
      .replace(/\/\*[\s\S]*?\*\//g, '')          /* 去注释 */
      .replace(/\s+/g, ' ')                      /* 空白统一压成单空格（token 安全） */
      .replace(/\s*([{};:,])\s*/g, '$1')          /* 标点两侧去空白（含逗号） */
      .replace(/;}/g, '}')                       /* 块尾多余分号 */
      /* 四值 padding / margin 折叠成两值：16px 30px 16px 30px -> 16px 30px */
      .replace(/(^|[;{])((?:padding|margin)(?:-(?:top|right|bottom|left))?):([^;{}]+)/g,
        function (m, pre, prop, val) {
          const p = val.trim().split(/\s+/);
          if (p.length === 4 && p[0] === p[2] && p[1] === p[3]) {
            return pre + prop + ':' + p[0] + ' ' + p[1];
          }
          return m;
        })
      .replace(/\b0(?:px|em|rem|pt|pc|in|cm|mm|ex|ch|q)\b/g, '0')  /* 零值去单位 */
      .replace(/(^|[^\d.])0\.(\d)/g, '$1.$2')   /* 0.12em -> .12em */
      .trim();
  }

  function minifyHTML(h) {
    return String(h).replace(/\n[ \t]*/g, '').trim();
  }

  /* ---------------- 绑定 ---------------- */

  document.querySelectorAll('[data-pvbg]').forEach(function (b) {
    b.addEventListener('click', function () {
      view.previewBg = b.dataset.pvbg;
      saveView(); syncViewChips(); render();
    });
  });

  document.querySelectorAll('[data-dev]').forEach(function (b) {
    b.addEventListener('click', function () {
      view.devW = Number(b.dataset.dev);
      saveView(); syncViewChips(); render();
    });
  });

  document.getElementById('vCodeHL').addEventListener('change', function (e) {
    view.codeHL = e.target.checked;
    saveView(); render();
  });

  document.getElementById('vMinify').addEventListener('change', function (e) {
    view.minify = e.target.checked;
    saveView(); render();
  });

  /* =========================================================
     顶栏
     ========================================================= */

  document.getElementById('randomBtn').addEventListener('click', randomize);
  document.getElementById('resetBtn').addEventListener('click', reset);

  /* =========================================================
     启动
     ========================================================= */

  boot();
})();
</script>
</body>
</html>
